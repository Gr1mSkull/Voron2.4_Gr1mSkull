#####################################################################
# AWD — 4 мотора XY (2 мотора на ремень)
# Включается опционально поверх обычной corexy (2WD).
# Кинематика остаётся corexy — добавляются доп. моторы stepper_x1 / stepper_y1.
#
# Свободные слоты на Manta M8P v2.0 (экструдер на EBB, поэтому Motor8 свободен):
#   stepper_x1 → Motor4 (step PB4 / dir PB3 / en PB6 / uart PB5)
#   stepper_y1 → Motor8 (step PC7 / dir PC8 / en PD2 / uart PC6)
#
# ВАЖНО: position_endstop / position_min / position_max и endstop здесь
# НЕ задаются — они наследуются от основных stepper_x / stepper_y.
# Доп. моторы не хоумятся отдельно, только тянут общий ремень.
#####################################################################

#####################################################################
# ⚠ ПРОВЕРКА НАПРАВЛЕНИЯ ПЕРЕД ПЕРВЫМ HOMING ⚠
# Доп. мотор должен тянуть ремень В ТУ ЖЕ сторону, что и основной.
# AWD-мод имеет зеркальную установку моторов → dir обычно инвертируется.
# НЕ запускайте G28, пока не проверите направление через FORCE_MOVE:
#   FORCE_MOVE STEPPER=stepper_x  DISTANCE=10 VELOCITY=20
#   FORCE_MOVE STEPPER=stepper_x1 DISTANCE=10 VELOCITY=20
# Оба должны двигать каретку в одну сторону. Если нет — снимите/добавьте "!"
# у dir_pin соответствующего мотора и перезапустите прошивку.
#####################################################################

# --- Доп. мотор оси X (тот же ремень B, что и stepper_x) ---
[stepper_x1]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
# endstop здесь НЕ указываем — хоумится только основной stepper_x

[tmc2209 stepper_x1]
uart_pin: PB5
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

# --- Доп. мотор оси Y (тот же ремень A, что и stepper_y) ---
[stepper_y1]
step_pin: PC7
dir_pin: !PC8
enable_pin: !PD2
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
# endstop здесь НЕ указываем — хоумится только основной stepper_y

[tmc2209 stepper_y1]
uart_pin: PC6
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0
