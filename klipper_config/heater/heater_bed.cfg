#####################################################################
# Нагрев стола — AC SSR ~300W
# HE1 на M8P | Термистор — проверьте тип на кабеле кровати
#####################################################################

[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PB1
max_power: 1.0
min_temp: 0
max_temp: 120
control: pid
pid_Kp: 58.437
pid_Ki: 2.347
pid_Kd: 363.769

# 300W @ 230V ≈ 1.3A — для SSR 25A max_power: 1.0 безопасен
# После сборки: PID_CALIBRATE HEATER=heater_bed TARGET=60
