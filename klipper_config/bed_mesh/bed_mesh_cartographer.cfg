#####################################################################
# Bed mesh через Cartographer (scan/touch)
# zero_reference_position = центр стола 500×500
#####################################################################

[bed_mesh]
zero_reference_position: 250, 250
speed: 300
horizontal_move_z: 3
mesh_min: 30, 30
mesh_max: 470, 470
probe_count: 20, 20
adaptive_margin: 10
mesh_pps: 0, 0
algorithm: bicubic
fade_start: 0.6
fade_end: 10.0
