#####################################################################
# Stealthburner — вентиляторы и RGB
#####################################################################

[fan]
pin: EBBCan:gpio13
kick_start_time: 0.5
off_below: 0.10

[heater_fan hotend_fan]
pin: EBBCan:gpio14
heater: extruder
heater_temp: 50.0
kick_start_time: 0.5

[fan_generic sb_leds_fan]
pin: EBBCan:gpio15
tachometer_pin: EBBCan:gpio12

[neopixel sb_leds]
pin: EBBCan:gpio16
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.3

[delayed_gcode set_stealthburner_led]
initial_duration: 2
gcode:
    SET_LED LED=sb_leds RED=0.3 GREEN=0.3 BLUE=0.3 WHITE=0.0 INDEX=1 TRANSMIT=0
    SET_LED LED=sb_leds RED=0.0 GREEN=0.0 BLUE=0.0 WHITE=0.3 INDEX=2 TRANSMIT=0
    SET_LED LED=sb_leds RED=0.0 GREEN=0.0 BLUE=0.0 WHITE=0.3 INDEX=3 TRANSMIT=0
