[adxl345]
cs_pin: cartographer:PA3
#cs_pin: cartographer:PA0
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
    250, 250, 20
    250, 100, 20
    250, 400, 20

