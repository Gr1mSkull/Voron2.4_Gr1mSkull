#####################################################################
# Cartographer 3D — режим C (Tap = Z, Cartographer = mesh + Input Shaper)
#
# Требуется Klipper-плагин Cartographer:
#   cd ~ && git clone https://github.com/Cartographer3D/cartographer-probe.git
#   (следуйте docs.cartographer3d.com)
#
# Подключение: раскомментируйте serial ИЛИ canbus_uuid
# Смещения x/y — от сопла до центра катушки (откалибровать!)
#####################################################################

[mcu cartographer]
# USB:
serial: /dev/serial/by-id/usb-cartographer_cartographer_REPLACE_ME-if00
# CAN (если Cartographer на CAN-шине):
#canbus_uuid: REPLACE_WITH_CARTOGRAPHER_UUID
#canbus_interface: can0
restart_method: command

[cartographer]
mcu: cartographer
# Смещения — ИЗМЕНИТЬ после установки на Stealthburner
x_offset: 0
y_offset: 24
verbose: no

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105
