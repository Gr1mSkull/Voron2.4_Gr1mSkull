#####################################################################
# Вентиляторы корпуса, exhaust, Nevermore, подсветка (MKS Monster8 V2.0)
# Вентиляторы хотенда и обдув детали — на EBB SB2209 (см. stealthburner.cfg).
#
# Эталон платы (рабочий принтер того же производителя):
# https://github.com/deflord/3def/tree/main/Конфигурационные%20файлы/MKS%208V2/SB2040V3/500
#
# CAN bridge (canbus_uuid в mcu.cfg): PB0/PB1 зарезервированы под CAN.
# В эталоне nevermore на PB0 (HE1) — у нас PA2 (FAN0).
#####################################################################

# PC0 (TB) — термистор стола + датчик для nevermore (как в эталоне deflord)
[duplicate_pin_override]
pins: PC0

# Аппаратный отсек — PA0 (FAN2 в эталоне)
[temperature_fan controller_fan]
pin: PA0
sensor_type: temperature_mcu
min_temp: -70
max_temp: 100
target_temp: 15
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
control: watermark

# Вытяжка — PA3 (HE2 в эталоне; НЕ путать с подсветкой!)
[fan_generic exhaust_fan]
pin: PA3
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0

# Nevermore — PA2 (в эталоне PB0/HE1, недоступен при CAN на PB0/PB1)
[temperature_fan nevermore]
pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
min_temp: 0
max_temp: 130
target_temp: 45
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 2.0
control: watermark

# Подсветка камеры — PA8 (neopixel, как в эталоне; НЕ PA3!)
[neopixel caselight]
pin: PA8
chain_count: 50
color_order: GRB
initial_RED: 0.3
initial_GREEN: 0.3
initial_BLUE: 0.3
