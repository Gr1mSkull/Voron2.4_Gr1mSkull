#####################################################################
# Вентиляторы корпуса, exhaust, Nevermore, подсветка (MKS Monster8 V2.0)
# Вентиляторы хотенда и обдув детали — на EBB SB2209 (см. stealthburner.cfg).
#
# CAN bridge (canbus_uuid в mcu.cfg): PB0/PB1 зарезервированы под CAN —
# разъёмы HE0/HE1 в конфиге использовать нельзя.
# Controller fan → FAN1 (PA1), не HE1 (PB0). Подсветка → HE2 (PA3).
#####################################################################

[heater_fan controller_fan]
pin: PA1                       # FAN1 (HE1/PB0 занят CAN)
kick_start_time: 0.5
heater: heater_bed
heater_temp: 45.0

[fan_generic exhaust_fan]
pin: PA0                       # FAN2
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0

[fan_generic nevermore]
pin: PA2                       # FAN0
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 2.0

[output_pin caselight]
pin: PA3                       # HE2 (24V LED strip)
pwm: true
shutdown_value: 0
value: 0
cycle_time: 0.01

# PS_ON: у Monster8 нет выделенного PS-ON порта в Voron-распиновке.
# Если управляете питанием через Klipper — заведите свободный GPIO
# (например PA9 / EXP) и раскомментируйте:
# [output_pin ps_on]
# pin: PA9
# value: 1
