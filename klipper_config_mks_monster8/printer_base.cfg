#####################################################################
# Базовые секции — Kalico (https://docs.kalico.gg)
# respond, exclude_object, force_move в Kalico включены по умолчанию.
#####################################################################

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 5.0

# Размеры сборки 500×500×480

[idle_timeout]
timeout: 1800

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]
