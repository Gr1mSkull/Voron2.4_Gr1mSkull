#####################################################################
# Нагрев стола — AC SSR ~300W (MKS Monster8 V2.0)
# H-BED (PB10) | Термистор TB (PC0) — как в эталоне deflord/3def
# https://github.com/deflord/3def/tree/main/Конфигурационные%20файлы/MKS%208V2/SB2040V3/500
#####################################################################

[heater_bed]
heater_pin: PB10
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
max_power: 1.0
min_temp: 0
max_temp: 120
control: pid
pid_Kp: 58.437
pid_Ki: 2.347
pid_Kd: 363.769

# 300W @ 230V ≈ 1.3A — для SSR 25A max_power: 1.0 безопасен
# После сборки: PID_CALIBRATE HEATER=heater_bed TARGET=60
