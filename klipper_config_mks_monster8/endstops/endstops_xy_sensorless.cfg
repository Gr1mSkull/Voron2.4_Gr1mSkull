#####################################################################
# XY — sensorless homing (StallGuard / TMC2209) на MKS Monster8 V2.0
# ⚠ Установите джамперы DIAG драйверов Driver0 (X) и Driver1 (Y) на разъёмы
#   X- (PA14) и Y- (PA15). На Monster8 Diag0..5 заводятся на X-,Y-,Z-,X+,Y+,Z+.
# После сборки откалибруйте driver_SGTHRS для X и Y (SGTHRS_TEST).
# Примечание: stepper_x и stepper_y делят один enable_pin PC15.
#####################################################################

[stepper_x]
step_pin: PC14
dir_pin: PC13
enable_pin: !PC15
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 500
position_max: 500
homing_speed: 50
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PE6
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PA14
driver_SGTHRS: 80

[stepper_y]
step_pin: PE5
dir_pin: PE4
enable_pin: !PC15
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
position_endstop: 500
position_max: 500
homing_speed: 50
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PE3
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PA15
driver_SGTHRS: 80
