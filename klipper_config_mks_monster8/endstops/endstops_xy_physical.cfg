#####################################################################
# XY — физические концевики (MKS Monster8 V2.0)
# X: EBB SB2209 (toolhead) — порт X / gpio6
# Y: Monster8 — разъём Y+ / PA15 (по проверенной Voron-распиновке)
# X = Driver0 (B-мотор), Y = Driver1 (A-мотор)
# Примечание: stepper_x и stepper_y делят один enable_pin PC15 (особенность платы).
#####################################################################

[stepper_x]
step_pin: PC14
dir_pin: PC13
enable_pin: !PC15
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^EBBCan:gpio6
position_min: 0
position_endstop: 500
position_max: 500
homing_speed: 50
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PE6
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

[stepper_y]
step_pin: PE5
dir_pin: PE4
enable_pin: !PC15
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PA15
position_min: 0
position_endstop: 500
position_max: 500
homing_speed: 50
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PE3
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

# ⚠ Направление моторов проверьте после сборки (G28 X / G28 Y).
#   Если ось едет от концевика — добавьте/уберите "!" у dir_pin.
