#####################################################################
# MCU — MKS Monster8 V2.0 (STM32F407) как USB-to-CAN bridge @ 1000000 + Raspberry Pi 4B
# Хост (RPi 4B) не имеет CAN — мост поднимает плата Monster8 (встроенный CAN-трансивер).
# UUID получить: sudo systemctl stop klipper && python3 ~/katapult/scripts/flash_can.py -q
#####################################################################

[mcu]
canbus_uuid: REPLACE_WITH_MONSTER8_UUID
canbus_interface: can0

[mcu EBBCan]
canbus_uuid: REPLACE_WITH_EBB_UUID
canbus_interface: can0

[temperature_sensor Monster8]
sensor_type: temperature_mcu

[temperature_sensor RaspberryPi]
sensor_type: temperature_host

# EXP1/EXP2 (если когда-нибудь понадобится mini12864; дисплей — KlipperScreen)
[board_pins]
aliases:
    EXP1_1=PB2, EXP1_2=PE10,
    EXP1_3=PE11, EXP1_4=PD10,
    EXP1_5=PD9, EXP1_6=PD8,
    EXP1_7=PE15, EXP1_8=PE7,
    EXP1_9=<GND>, EXP1_10=<5V>,
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PE9, EXP2_4=PA4,
    EXP2_5=PE8, EXP2_6=PA7,
    EXP2_7=PB11, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<3.3v>
