#####################################################################
# Cartographer 3D — Z homing + bed mesh + Input Shaper
#
# Плагин (Kalico): doc/kalico_setup.md
# Документация: https://docs.cartographer3d.com
#
# [cartographer] должна быть ВЫШЕ [stepper_z] (см. порядок includes в printer.cfg).
# Секция [probe] с pin НЕ нужна.
#####################################################################

[mcu cartographer]
# --- USB (restart_method только для serial) ---
#serial: /dev/serial/by-id/usb-cartographer_cartographer_REPLACE_ME-if00
#restart_method: command

# --- CAN (restart_method НЕ указывать) ---
canbus_uuid: REPLACE_WITH_CARTOGRAPHER_UUID
canbus_interface: can0

[cartographer]
mcu: cartographer
# Некоторые версии cartographer3d-plugin (и/или Kalico) позволяют выключать
# регистрацию виртуального endstop как "probe:" (register_as_probe=false),
# из-за чего появляется ошибка "Unknown pin chip name 'probe'".
# Явно включаем стандартный неймспейс probe:z_virtual_endstop.
register_as_probe: true
# Смещения — от сопла до центра катушки (откалибровать!)
x_offset: 0
y_offset: 24
verbose: no

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105
