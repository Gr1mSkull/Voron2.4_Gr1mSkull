#####################################################################
# ▲▲▲ КОНЕЦ ПЕРЕКЛЮЧАТЕЛЕЙ XY ▲▲▲
#####################################################################


#####################################################################
# Z — 4 мотора, quad gantry (Voron/RealDeuce pinout)
# Z0=Driver2, Z1=Driver3 (E0), Z2=Driver4 (E1), Z3=Driver5 (E2)
#####################################################################

[stepper_z]
step_pin: PE1
dir_pin: PE0
enable_pin: !PE2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 480
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PB7
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z1]
step_pin: PB5
dir_pin: PB4
enable_pin: !PB6
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PB3
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z2]
step_pin: PD6
dir_pin: PD5
enable_pin: !PD7
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PD4
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z3]
step_pin: PD2
dir_pin: PD1
enable_pin: !PD3
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PD0
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
# EXTRUDER — Clockwork 2 + Bambu X1C hotend (0.4 mm)
#####################################################################

[extruder]
step_pin: EBBCan:gpio18
dir_pin: !EBBCan:gpio19
enable_pin: !EBBCan:gpio17
microsteps: 16
rotation_distance: 22.6789511
gear_ratio: 50:10
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_only_distance: 150
heater_pin: EBBCan:gpio7
sensor_type: ATC Semitec 104GT-2
sensor_pin: EBBCan:gpio27
min_temp: 0
max_temp: 300
max_power: 1.0
min_extrude_temp: 170
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
pressure_advance: 0.04
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: EBBCan:gpio20
run_current: 0.650
sense_resistor: 0.110
stealthchop_threshold: 999999

[temperature_sensor EBB_NTC]
sensor_type: Generic 3950
sensor_pin: EBBCan:gpio28

[filament_switch_sensor runout_sensor]
pause_on_runout: True
switch_pin: ^EBBCan:gpio24
runout_gcode:
    PAUSE
    M117 Filament runout!
insert_gcode:
    M117 Filament inserted


#####################################################################
# STEALTHBURNER — вентиляторы и RGB (EBB SB2209)
#####################################################################

[fan]
pin: EBBCan:gpio13
kick_start_time: 0.5
off_below: 0.10

[heater_fan hotend_fan]
pin: EBBCan:gpio14
heater: extruder
heater_temp: 50.0
kick_start_time: 0.5

[fan_generic sb_leds_fan]
pin: EBBCan:gpio15
tachometer_pin: EBBCan:gpio12

[neopixel sb_leds]
pin: EBBCan:gpio16
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.3

[delayed_gcode set_stealthburner_led]
initial_duration: 2
gcode:
    SET_LED LED=sb_leds RED=0.3 GREEN=0.3 BLUE=0.3 WHITE=0.0 INDEX=1 TRANSMIT=0
    SET_LED LED=sb_leds RED=0.0 GREEN=0.0 BLUE=0.0 WHITE=0.3 INDEX=2 TRANSMIT=0
    SET_LED LED=sb_leds RED=0.0 GREEN=0.0 BLUE=0.0 WHITE=0.3 INDEX=3 TRANSMIT=0


#####################################################################
# НАГРЕВ СТОЛА — AC SSR ~300W
# H-BED PB10 | Термистор TB PC0 (эталон deflord)
#####################################################################

[heater_bed]
heater_pin: PB10
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
max_power: 1.0
min_temp: 0
max_temp: 120
control: pid
pid_Kp: 58.437
pid_Ki: 2.347
pid_Kd: 363.769

# PID_CALIBRATE HEATER=heater_bed TARGET=60


#####################################################################
# ВЕНТИЛЯТОРЫ КОРПУСА, EXHAUST, NEVERMORE, ПОДСВЕТКА
# Пины по эталону deflord: PA0 апп.отсек, PA3 вытяжка, PA8 подсветка.
# CAN bridge: PB0/PB1 зарезервированы → nevermore на PA2 (FAN0).
#
# ⚠ Без temperature_fan + sensor_pin на mcu — только heater_bed читает PC0.
#   Иначе: "Not a valid ADC pin" / конфликты ADC на плате.
#####################################################################

[heater_fan controller_fan]
pin: PA0
heater: heater_bed
heater_temp: 45.0
max_power: 1.0
kick_start_time: 5.0

[fan_generic exhaust_fan]
pin: PA3
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0

[fan_generic nevermore]
pin: PA2
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 2.0

[neopixel caselight]
pin: PA8
chain_count: 50
color_order: GRB
initial_RED: 0.3
initial_GREEN: 0.3
initial_BLUE: 0.3


#####################################################################
# HOMING
#####################################################################

[safe_z_home]
home_xy_position: 250, 250
speed: 100
z_hop: 10

[quad_gantry_level]
gantry_corners:
    -60, -10
    560, 570
points:
    50, 25
    50, 425
    450, 425
    450, 25
speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10


#####################################################################
# МАКРОСЫ — Voron 2.4 + Kalico + Cartographer 3D
#####################################################################

[gcode_macro _USER_VARIABLES]
variable_probe_max_temp: 150
variable_bed_center_x: 250
variable_bed_center_y: 250
variable_adaptive_margin: 10
variable_purge_x_start: 50
variable_purge_x_end: 150
variable_purge_y: 20
variable_purge_z: 0.2
variable_purge_extrude: 35
variable_purge_feedrate: 1500
variable_use_physical_endstops: True
variable_verbose: True
gcode:
    # SET_GCODE_VARIABLE MACRO=_USER_VARIABLES VARIABLE=purge_y VALUE=25

[gcode_macro LIGHTS_ON]
description: Включить подсветку камеры
gcode:
    SET_LED LED=caselight RED=1 GREEN=1 BLUE=1

[gcode_macro LIGHTS_OFF]
description: Выключить подсветку камеры
gcode:
    SET_LED LED=caselight RED=0 GREEN=0 BLUE=0

[gcode_macro LIGHTS_TOGGLE]
description: Переключить подсветку
gcode:
    {% if printer['neopixel caselight'].color_data[0][0] > 0.5 %}
        SET_LED LED=caselight RED=0 GREEN=0 BLUE=0
    {% else %}
        SET_LED LED=caselight RED=1 GREEN=1 BLUE=1
    {% endif %}

[gcode_macro NEVERMORE_ON]
description: Включить Nevermore
gcode:
    SET_FAN_SPEED FAN=nevermore SPEED=1.0

[gcode_macro NEVERMORE_OFF]
description: Выключить Nevermore
gcode:
    SET_FAN_SPEED FAN=nevermore SPEED=0

[gcode_macro EXHAUST_ON]
description: Включить вытяжку
gcode:
    SET_FAN_SPEED FAN=exhaust_fan SPEED=1.0

[gcode_macro EXHAUST_OFF]
description: Выключить вытяжку
gcode:
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0

[gcode_macro STEALTH_LED]
description: Stealthburner LED — R G B W (0-1)
gcode:
    {% set r = params.R|default(0.3)|float %}
    {% set g = params.G|default(0.3)|float %}
    {% set b = params.B|default(0.3)|float %}
    {% set w = params.W|default(0.0)|float %}
    SET_LED LED=sb_leds RED={r} GREEN={g} BLUE={b} WHITE={w} SYNC=1

[gcode_macro G32]
description: Homing XY + QGL + повторный Z (без mesh)
gcode:
    BED_MESH_CLEAR
    G28
    QUAD_GANTRY_LEVEL
    G28 Z
    G0 X{printer["gcode_macro _USER_VARIABLES"].bed_center_x} Y{printer["gcode_macro _USER_VARIABLES"].bed_center_y} Z30 F3600

[gcode_macro MESH]
description: Сетка стола (scan); ADAPTIVE=1 если в слайсере заданы объекты
gcode:
    {% set adaptive = params.ADAPTIVE|default(0)|int %}
    {% set margin = printer["gcode_macro _USER_VARIABLES"].adaptive_margin|int %}
    {% if adaptive %}
        BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN={margin}
    {% else %}
        BED_MESH_CALIBRATE
    {% endif %}
    SAVE_CONFIG

[gcode_macro _PURGE_LINE]
description: Продувочная линия (внутренний)
gcode:
    {% set u = printer["gcode_macro _USER_VARIABLES"] %}
    {% set x0 = u.purge_x_start|float %}
    {% set x1 = u.purge_x_end|float %}
    {% set y = u.purge_y|float %}
    {% set z = u.purge_z|float %}
    {% set e = u.purge_extrude|float %}
    {% set f = u.purge_feedrate|float %}
    M117 Purge line...
    G90
    G92 E0
    G1 Z5 F3000
    G1 X{x0} Y{y} Z5 F12000
    G1 Z{z} F600
    G1 X{x0} Y{y} F6000
    G1 X{x1} Y{y} E{e} F{f}
    G1 Z5 F3000
    G92 E0

[gcode_macro PURGE_LINE]
description: Ручная продувочная линия
gcode:
    _PURGE_LINE

[gcode_macro PRINT_START]
description: Старт печати — Cartographer touch home + adaptive mesh
gcode:
    {% set bed_temp = params.BED_TEMP|default(60)|float %}
    {% set extruder_temp = params.EXTRUDER_TEMP|default(200)|float %}
    {% set probe_temp = printer["gcode_macro _USER_VARIABLES"].probe_max_temp|float %}
    {% set cx = printer["gcode_macro _USER_VARIABLES"].bed_center_x|float %}
    {% set cy = printer["gcode_macro _USER_VARIABLES"].bed_center_y|float %}
    LIGHTS_ON
    SET_GCODE_OFFSET Z=0
    BED_MESH_CLEAR
    G28
    G90
    M104 S{probe_temp}
    M140 S{bed_temp}
    M190 S{bed_temp}
    QUAD_GANTRY_LEVEL
    G28 Z
    M109 S{probe_temp}
    CARTOGRAPHER_TOUCH_HOME
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN={printer["gcode_macro _USER_VARIABLES"].adaptive_margin|int}
    M104 S{extruder_temp}
    M109 S{extruder_temp}
    _PURGE_LINE
    G1 Z5 F3000
    G0 X{cx} Y{cy} F6000
    M117 Printing...

[gcode_macro PRINT_END]
description: Завершение печати
gcode:
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    M400
    G92 E0
    G1 E-8.0 F3600
    G91
    G0 Z2.0 X20.0 Y20.0 F20000
    TURN_OFF_HEATERS
    M107
    G90
    G0 X250 Y480 F6000
    BED_MESH_CLEAR
    NEVERMORE_ON
    EXHAUST_ON
    UPDATE_DELAYED_GCODE ID=exhaust_off DURATION=600
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

[delayed_gcode exhaust_off]
gcode:
    EXHAUST_OFF
    NEVERMORE_OFF

[gcode_macro CANCEL_PRINT]
description: Отмена печати
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    M107
    BED_MESH_CLEAR
    G91
    G0 Z10 F600
    G90
    G0 X250 Y480 F6000
    LIGHTS_OFF
    EXHAUST_ON
    UPDATE_DELAYED_GCODE ID=exhaust_off DURATION=300
    BASE_CANCEL_PRINT

[gcode_macro PAUSE]
description: Пауза печати
rename_existing: BASE_PAUSE
gcode:
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 Z10 F600
    G90
    G0 X250 Y480 F6000

[gcode_macro RESUME]
description: Продолжить печать
rename_existing: BASE_RESUME
gcode:
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=100
    BASE_RESUME

[gcode_macro SGTHRS_TEST]
description: Тест sensorless — SGTHRS_TEST AXIS=X VALUE=80
gcode:
    {% set axis = params.AXIS|default('X')|upper %}
    {% set val = params.VALUE|default(80)|int %}
    {% if axis == 'X' %}
        SET_TMC_FIELD STEPPER=stepper_x FIELD=SGTHRS VALUE={val}
    {% elif axis == 'Y' %}
        SET_TMC_FIELD STEPPER=stepper_y FIELD=SGTHRS VALUE={val}
    {% else %}
        { action_raise_error("AXIS must be X or Y") }
    {% endif %}
    M117 {axis} SGTHRS={val}
    G28 {axis}


#####################################################################
# АЛЬТЕРНАТИВА: VORON TAP (вместо Cartographer)
# 1. Закомментируйте все секции CARTOGRAPHER / bed_mesh / adxl345 выше
