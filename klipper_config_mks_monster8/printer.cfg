#####################################################################
# printer.cfg — Voron 2.4 (MKS Monster8 V2.0 + RPi 4B)
# Прошивка хоста: Kalico (https://docs.kalico.gg) — НЕ mainline Klipper
# Z-проба: Cartographer 3D (без Voron Tap)
# Установка ПО: doc/kalico_setup.md | CAN: doc/can0_setup.md
#####################################################################

# --- Базовые модули (не отключать) ---
[include mcu.cfg]

# --- Cartographer: ВСЕ секции пробы ДО stepper_z (иначе probe:z_virtual_endstop не найдётся) ---
[include bed_mesh/bed_mesh_cartographer.cfg]
[include probes/cartographer.cfg]
[include input_shaper/input_shaper_cartographer.cfg]

[include printer_base.cfg]

#####################################################################
# ▼▼▼ ПЕРЕКЛЮЧАТЕЛИ — измените только этот блок ▼▼▼
#####################################################################

# --- XY ENDSTOPS: раскомментируйте РОВНО ОДИН вариант ---
[include endstops/endstops_xy_physical.cfg]
# [include endstops/endstops_xy_sensorless.cfg]

# --- ПРИВОД XY: 2 мотора (по умолчанию) или 4 мотора (AWD) ---
# 2WD — ничего не включайте (используются только stepper_x / stepper_y выше).
# 4WD — раскомментируйте строку ниже (добавит stepper_x1 / stepper_y1).
#       ⚠ Сначала прочтите предупреждение о направлении в drive/xy_awd.cfg
# [include drive/xy_awd.cfg]

# --- Z-ПРОБА: Cartographer ИЛИ Voron Tap (блок A или B) ---
# Плагин cartographer3d-plugin + Kalico: doc/kalico_setup.md
# [cartographer] должна быть ВЫШЕ stepper_z.

# Блок A — Cartographer (Z homing + mesh + Input Shaper) ← этот принтер
# Секции cartographer подключены в начале printer.cfg (сразу после mcu.cfg).

# Блок B — Voron Tap (Z homing + mesh, ADXL на EBB; Cartographer не нужен)
# [include bed_mesh/bed_mesh_tap.cfg]
# [include input_shaper/input_shaper_ebb.cfg]
# [include probes/tap.cfg]

#####################################################################
# ▲▲▲ КОНЕЦ ПЕРЕКЛЮЧАТЕЛЕЙ ▲▲▲
#####################################################################

[include steppers/steppers_z.cfg]
[include extruder/extruder.cfg]
[include extruder/stealthburner.cfg]
[include heater/heater_bed.cfg]
[include fans/fans.cfg]
[include homing/safe_z_home.cfg]
[include homing/quad_gantry_level.cfg]
[include macros/macros.cfg]

# KlipperScreen: ~/KlipperScreen/KlipperScreen.conf
