#####################################################################
# printer.cfg — Voron 2.4 500×500×480 (MKS Monster8 V2.0 + RPi 4B)
# Единый конфиг — всё в одном файле, без [include].
#
# Прошивка хоста: Kalico (https://docs.kalico.gg) — НЕ mainline Klipper
# Z-проба: Cartographer 3D (без Voron Tap)
# Эталон платы: https://github.com/deflord/3def/tree/main/Конфигурационные%20файлы/MKS%208V2/SB2040V3/500
#
# Установка: doc/kalico_setup.md | CAN: doc/can0_setup.md
# UUID: ~/klippy-env/bin/python ~/kalico/scripts/canbus_query.py can0
#####################################################################


#####################################################################
# MCU — MKS Monster8 + EBB SB2209 (Kalico CAN @ 1000000)
#
# UUID: ~/klippy-env/bin/python ~/kalico/scripts/canbus_query.py can0
#
# ⚠ ПРОВЕРКА ПОСЛЕ FIRMWARE_RESTART (строка MCU '…' config: MCU=…):
#   mcu          → MCU=stm32f407xx   (MKS Monster8, НЕ stm32g0b1!)
#   EBBCan       → MCU=rp2040        (EBB SB2209, НЕ stm32f407!)
#   cartographer → CARTOGRAPHER x.x.x
#
# Если mcu=stm32g0b1xx — UUID чужой платы (UTOC/U2C). Если EBBCan=stm32f407
# с CANBUS_BRIDGE=1 — в слот EBB попал Monster8. Перепишите UUID ниже.
# G0B1/U2C на шине CAN в printer.cfg НЕ указывать — только USB-мост для can0.
#####################################################################

[mcu]
canbus_uuid: REPLACE_WITH_MONSTER8_UUID
canbus_interface: can0

[mcu EBBCan]
canbus_uuid: REPLACE_WITH_EBB_UUID
canbus_interface: can0

# Температура платы Monster8 — не используем sensor_type: temperature_mcu на mcu
# (даёт ошибки ADC_TEMPERATURE / Not a valid ADC pin в CAN-bridge режиме).
# Охлаждение аппаратного отсека — heater_fan controller_fan ниже.

[temperature_sensor RaspberryPi]
sensor_type: temperature_host

# EXP1/EXP2 (mini12864; дисплей — KlipperScreen)
[board_pins]
aliases:
    EXP1_1=PB2, EXP1_2=PE10,
    EXP1_3=PE11, EXP1_4=PD10,
    EXP1_5=PD9, EXP1_6=PD8,
    EXP1_7=PE15, EXP1_8=PE7,
    EXP1_9=<GND>, EXP1_10=<5V>,
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PE9, EXP2_4=PA4,
    EXP2_5=PE8, EXP2_6=PA7,
    EXP2_7=PB11, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<3.3v>


#####################################################################
# CARTOGRAPHER 3D — Z homing + bed mesh + Input Shaper
# Плагин: doc/kalico_setup.md | https://docs.cartographer3d.com
#
# ⚠ Секции [cartographer] и [mcu cartographer] ДОЛЖНЫ быть ВЫШЕ [stepper_z]
# Секция [probe] с pin НЕ нужна.
#####################################################################

[mcu cartographer]
# --- USB (restart_method только для serial) ---
#serial: /dev/serial/by-id/usb-cartographer_cartographer_REPLACE_ME-if00
#restart_method: command

# --- CAN (restart_method НЕ указывать) ---
canbus_uuid: REPLACE_WITH_CARTOGRAPHER_UUID
canbus_interface: can0

[cartographer]
mcu: cartographer
# Смещения — от сопла до центра катушки (откалибровать!)
x_offset: 0
y_offset: 24
verbose: no

[cartographer coil]

[cartographer scan]

[cartographer touch]

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105


#####################################################################
# BED MESH — Cartographer (scan/touch)
#####################################################################

[bed_mesh]
zero_reference_position: 250, 250
speed: 300
horizontal_move_z: 3
mesh_min: 30, 30
mesh_max: 470, 470
probe_count: 20, 20
adaptive_margin: 10
mesh_pps: 0, 0
algorithm: bicubic
fade_start: 0.6
fade_end: 10.0


#####################################################################
# INPUT SHAPER — ADXL345 на Cartographer
# V3: PA3 | V4: PA0 — раскомментируйте нужный cs_pin
#####################################################################

[adxl345]
cs_pin: cartographer:PA3
#cs_pin: cartographer:PA0
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
    250, 250, 20
    250, 100, 20
    250, 400, 20

# Калибровка: SHAPER_CALIBRATE → SAVE_CONFIG


#####################################################################
# PRINTER — базовые секции Kalico
#####################################################################

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 5.0

[idle_timeout]
timeout: 1800

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]


#####################################################################
# ▼▼▼ ПЕРЕКЛЮЧАТЕЛИ XY — измените только этот блок ▼▼▼
#
# Концевики: физические (активно) ИЛИ sensorless (закомментируйте один блок)
# Привод: 2WD (по умолчанию) ИЛИ 4WD/AWD (раскомментируйте блок AWD ниже)
#####################################################################


#####################################################################
# XY — ФИЗИЧЕСКИЕ КОНЦЕВИКИ (активно)
# X: EBB SB2209 gpio6 | Y: Monster8 PA15
# X = Driver0 (B), Y = Driver1 (A); enable_pin PC15 общий для X и Y
#####################################################################

[stepper_x]
step_pin: PC14
dir_pin: PC13
enable_pin: !PC15
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^EBBCan:gpio6
position_min: 0
position_endstop: 500
position_max: 500
homing_speed: 50
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PE6
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

[stepper_y]
step_pin: PE5
dir_pin: PE4
enable_pin: !PC15
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PA15
position_min: 0
position_endstop: 500
position_max: 500
homing_speed: 50
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PE3
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

# ⚠ Направление: G28 X/Y — если ось едет от концевика, добавьте/уберите "!" у dir_pin


#####################################################################
# XY — SENSORLESS (альтернатива: закомментируйте блок выше, раскомментируйте этот)
# Джамперы DIAG Driver0 (X) и Driver1 (Y) → X- (PA14), Y- (PA15)
