#####################################################################
# Gr1mSkull Voron 2.4 500×500×480 (MKS Monster8 V2.0 + RPi 4B)
#
# Прошивка хоста: Kalico (https://docs.kalico.gg)
# Z-проба: Cartographer 3D | Голова: EBB SB2209 CAN
#
# Единый printer.cfg — периферия по эталону 3Def SB2040V3/500:
#   таймлапс, очистка сопла, StealthBurner LED, датчик филамента,
#   подсветка камеры, Nevermore (без модуля вкл/выкл).
#
# Установка: doc/kalico_setup.md | CAN: doc/can0_setup.md
#####################################################################

#####################################################################
# Gr1mSkull Voron 2.4 500×500×480 (MKS Monster8 V2.0 + RPi 4B)
#
# Прошивка хоста: Kalico (https://docs.kalico.gg) — НЕ mainline Klipper
# Z-проба: Cartographer 3D 
#
# Установка: doc/kalico_setup.md | CAN: doc/can0_setup.md
# UUID: ~/klippy-env/bin/python ~/kalico/scripts/canbus_query.py can0
#####################################################################


[mcu]
canbus_uuid: 2a4b2217ac3b
canbus_interface: can0

[mcu EBBCan]
canbus_uuid: f751b116e757
canbus_interface: can0

# Температура апп. отсека: temperature_mcu (ADC_TEMPERATURE) на Monster8 в CAN-режиме
# недоступен / конфликтует с controller_fan. Используем temperature_host (RPi в том же отсеке).
# Охлаждение — [temperature_fan controller_fan] на PA0, датчик = temperature_host.

[temperature_sensor RaspberryPi]
sensor_type: temperature_host

[temperature_sensor Monster8]
sensor_type: temperature_host
min_temp: 0
max_temp: 85

# EXP1/EXP2 (mini12864; дисплей — KlipperScreen)
[board_pins]
aliases:
    EXP1_1=PB2, EXP1_2=PE10,
    EXP1_3=PE11, EXP1_4=PD10,
    EXP1_5=PD9, EXP1_6=PD8,
    EXP1_7=PE15, EXP1_8=PE7,
    EXP1_9=<GND>, EXP1_10=<5V>,
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PE9, EXP2_4=PA4,
    EXP2_5=PE8, EXP2_6=PA7,
    EXP2_7=PB11, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<3.3v>

[output_pin beeper]
pin: EXP1_1


#####################################################################
# CARTOGRAPHER 3D — Z homing + bed mesh + Input Shaper
# Плагин: doc/kalico_setup.md | https://docs.cartographer3d.com
#
# ⚠ Секции [cartographer] и [mcu cartographer] ДОЛЖНЫ быть ВЫШЕ [stepper_z]
# Секция [probe] с pin НЕ нужна.
#####################################################################

[mcu cartographer]
# --- USB (restart_method только для serial) ---
#serial: /dev/serial/by-id/usb-cartographer_cartographer_REPLACE_ME-if00
#restart_method: command

# --- CAN (restart_method НЕ указывать) ---
canbus_uuid: 9308d4c26cb1
canbus_interface: can0

[cartographer]
mcu: cartographer
# Смещения — от сопла до центра катушки (откалибровать!)
x_offset: 0
y_offset: 24
verbose: no

[cartographer coil]

[cartographer scan]
# Модель scan — в блоке SAVE_CONFIG внизу файла.

[cartographer touch]
# Touch-модель — в блоке SAVE_CONFIG внизу файла.

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105


#####################################################################
# BED MESH — Cartographer (scan/touch)
#####################################################################

[bed_mesh]
zero_reference_position: 250, 250
speed: 400
horizontal_move_z: 3
mesh_min: 30, 30
mesh_max: 470, 470
probe_count: 20, 20
adaptive_margin: 10
mesh_pps: 0, 0
algorithm: bicubic
fade_start: 0.6
fade_end: 10.0


#####################################################################
# INPUT SHAPER — ADXL345 на Cartographer
# V3: PA3 | V4: PA0 — раскомментируйте нужный cs_pin
#####################################################################

[adxl345]
cs_pin: cartographer:PA3
#cs_pin: cartographer:PA0
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
    250, 250, 20
    250, 100, 20
    250, 400, 20

# Калибровка: SHAPER_CALIBRATE → SAVE_CONFIG


#####################################################################
# PRINTER — базовые секции Kalico
#####################################################################

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 5.0

[idle_timeout]
timeout: 1800

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]


#####################################################################
# XY — SENSORLESS HOMING (TMC2209 StallGuard) — единственный режим
#
# Monster8 Voron 2.4: DIAG Driver0 → X- (PA14), Driver1 → Y- (PA15).
# Джамперы: DIAG на X-/Y-; UART — зелёный; Z-драйверы — DIAG сняты.
# stealthchop_threshold: 0 обязателен для StallGuard.
#
# Подбор чувствительности: SGTHRS_TEST AXIS=X VALUE=80 → G28 X
#                          SGTHRS_TEST AXIS=Y VALUE=115 → G28 Y
# (255 = чувствительнее, 0 = грубее; Y часто выше X)
# Текущие значения: X=150, Y=161.
# Подбор Y (узкое окно!): 162 — упор, 163 — сразу stall, не едет.
#                          Рабочее: SGTHRS=161, homing_speed=45 (не ниже 35 — ложный stall).
#                          Не едет → уменьшить (160). Бьётся → 162 или speed 40.
#
# Если G28 Y едет не туда — уберите/добавьте "!" у dir_pin stepper_y.
#####################################################################

[stepper_x]
step_pin: PC14
dir_pin: PC13
enable_pin: !PC15
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 500
position_max: 500
homing_speed: 60
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PE6
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PA14
driver_SGTHRS: 150

[stepper_y]
step_pin: PE5
dir_pin: !PE4
enable_pin: !PC15
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
position_endstop: 500
position_max: 500
homing_speed: 50
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PE3
interpolate: false
run_current: 0.85
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PA15
driver_SGTHRS: 161


#####################################################################
# Z — quad gantry (3Def/deflord pinout, MKS Monster8 V2)
# Z0=Driver2:Z2, Z1=Driver4:E1, Z2=Driver5:E2, Z3=Driver6:E3
#
# Вибрация при подъёме Z: interpolate:false (как 3Def), медленный z_hop.
# Механика: натяжение ремней Z, винты на шкивах, все 4 мотора в одну сторону.
#####################################################################

[stepper_z]
step_pin: PE1
dir_pin: !PE0
enable_pin: !PE2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 480
homing_speed: 12
second_homing_speed: 5
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PB7
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z1]
step_pin: PD6
dir_pin: PD5
enable_pin: !PD7
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PD4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z2]
step_pin: PD2
dir_pin: !PD1
enable_pin: !PD3
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PD0
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z3]
step_pin: PC7
dir_pin: PC6
enable_pin: !PC8
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PD15
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
# EXTRUDER + EBB STM32G0 — Clockwork 2 + Bambu X1C hotend (0.4 mm)
#####################################################################

[extruder]
step_pin: EBBCan:PD0
dir_pin: EBBCan:PD1
enable_pin: !EBBCan:PD2
microsteps: 16
rotation_distance: 22.6789511
gear_ratio: 50:10
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_only_distance: 150
heater_pin: EBBCan:PB13
sensor_type: ATC Semitec 104GT-2
sensor_pin: EBBCan:PA3
min_temp: 0
max_temp: 300
max_power: 1.0
min_extrude_temp: 170
control: pid
pid_Kp: 28.874
pid_Ki: 6.277
pid_Kd: 33.205
pressure_advance: 0.052
pressure_advance_smooth_time: 0.035

[tmc2209 extruder]
uart_pin: EBBCan:PA15
run_current: 0.650
sense_resistor: 0.110
stealthchop_threshold: 999999

[temperature_sensor EBB_NTC]
sensor_type: Generic 3950
sensor_pin: EBBCan:PA2


#####################################################################
# STEALTHBURNER — EBB STM32G0
#####################################################################

[fan]
pin: EBBCan:PA1
kick_start_time: 0.5
min_power: 0.10

[heater_fan hotend_fan]
pin: EBBCan:PA0
heater: extruder
heater_temp: 50.0
kick_start_time: 0.5

[fan_generic sb_leds_fan]
pin: EBBCan:PB14
tachometer_pin: EBBCan:PB15
[neopixel sb_leds]
pin: EBBCan:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.3

# НАГРЕВ СТОЛА — AC SSR ~300W
# H-BED PB10 | Термистор TB PC0 (эталон deflord)
#####################################################################

[heater_bed]
heater_pin: PB10
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
max_power: 1.0
min_temp: 0
max_temp: 120
control: pid
pid_Kp: 61.181
pid_Ki: 3.067
pid_Kd: 305.142

# PID_CALIBRATE HEATER=heater_bed TARGET=60


#####################################################################
# ВЕНТИЛЯТОРЫ — эталон 3Def (Monster8 V2)
# Nevermore PB0 | вытяжка PA3 | апп.отсек PA0 | подсветка PA8
#####################################################################

[duplicate_pin_override]
pins: PC0

[temperature_fan nevermore]
pin: PB0
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
min_temp: -70
max_temp: 130
target_temp: 110
gcode_id: A
control: watermark

[fan_generic exhaust_fan]
pin: PA3
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0

[temperature_fan controller_fan]
pin: PA0
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
sensor_type: temperature_host
min_temp: -70
max_temp: 100
target_temp: 50
gcode_id: D
control: watermark
[neopixel Подсветка]
pin: PA8
chain_count: 50
color_order: GRB
initial_RED: 0.3
initial_GREEN: 0.3
initial_BLUE: 0.3

#####################################################################
# Voron: перед XY портал должен ПОДНИМАТЬСЯ. Макрос G28 делает Z-hop 15 мм.
# safe_z_home z_hop — дополнительная страховка при любом G28.
# Если портал всё равно опускается — инвертируйте dir_pin на всех stepper_z*
# (например stepper_z: dir_pin: !PE0).
#####################################################################

[safe_z_home]
home_xy_position: 250, 250
speed: 150
z_hop: 15
z_hop_speed: 15

[gcode_macro G28]
rename_existing: G28.1326
description: Homing с подъёмом Z перед движением по XY
gcode:
    {% set hop = 15.0 %}
    {% set home_all = params.X is not defined and params.Y is not defined and params.Z is not defined %}
    {% set home_x = params.X is defined or home_all %}
    {% set home_y = params.Y is defined or home_all %}

    {% if home_x or home_y %}
        {% if 'z' in printer.toolhead.homed_axes %}
            G90
            {% if printer.toolhead.position.z < hop %}
                G0 Z{hop} F900
            {% endif %}
        {% else %}
            SET_KINEMATIC_POSITION Z=0
            G90
            G0 Z{hop} F480
        {% endif %}
    {% endif %}
    G28.1326 {rawparams}

[quad_gantry_level]
gantry_corners:
    -60, -10
    560, 570
points:
    50, 25
    50, 425
    450, 425
    450, 25
speed: 200
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

#####################################################################
# ДАТЧИК ФИЛАМЕНТА (эталон 3Def)
#####################################################################

[filament_motion_sensor Пластик]
detection_length: 22                # Длина пластика, при которой срабатывает датчик. 
                                    # Если датчик срабатывает слишком часто,
                                    # увеличьте данную длину
extruder: extruder

switch_pin: PB12                    # PIN, на который подключен датчик пластика
PAUSE_on_runout: True               # Если True, то при срабатывании датчика принтер будет
                                    # становиться на паузу
# G-Code при срабатывании датчика
runout_gcode:                        
    PAUSE
    SET_PIN PIN=beeper VALUE=1     
    G4 P3000
    SET_PIN PIN=beeper VALUE=0
    G4 P3000
    SET_PIN PIN=beeper VALUE=1 
    G4 P3000
    SET_PIN PIN=beeper VALUE=0

#####################################################################
# NEVERMORE / ВЫТЯЖКА / ПОДСВЕТКА (эталон 3Def)
#####################################################################

[gcode_macro NEVERMORE_ON]
description: Включить Nevermore
gcode:
    SET_FAN_SPEED FAN=nevermore SPEED=1.0

[gcode_macro NEVERMORE_OFF]
description: Выключить Nevermore
gcode:
    SET_FAN_SPEED FAN=nevermore SPEED=0

[gcode_macro EXHAUST_ON]
description: Включить вытяжку
gcode:
    SET_FAN_SPEED FAN=exhaust_fan SPEED=1.0

[gcode_macro EXHAUST_OFF]
description: Выключить вытяжку
gcode:
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0

[delayed_gcode exhaust_off]
gcode:
    EXHAUST_OFF
    NEVERMORE_OFF

[gcode_macro offled]                       # Макрос выключения освещения печатной камеры
gcode:
     # SET_LED LED=mini12864 RED=0 GREEN=0 BLUE=0
     SET_LED LED=Подсветка GREEN=0 RED=0 BLUE=0
     SET_LED LED=sb_leds GREEN=0 RED=0 BLUE=0 WHITE=0

[gcode_macro onled]                        # Макрос включения освещения печатной камеры
gcode:
     # SET_LED LED=mini12864 RED=1 GREEN=1 BLUE=1
     SET_LED LED=Подсветка GREEN=1 RED=1 BLUE=1
     SET_LED LED=sb_leds GREEN=1 RED=1 BLUE=1 WHITE=1
#####################################################################
# STEALTHBURNER LED (эталон 3Def)
#####################################################################

# Macros for setting the status leds on the Voron StealthBurner toolhead (or for any neopixel-type leds).
#
# You will need to configure a neopixel (or other addressable led, such as dotstar). See
# https://www.klipper3d.org/Config_Reference.html#neopixel for configuration details.
#
# CONFIGURATION
# Example neopixel configuration:
[gcode_macro _sb_vars]
# User settings for the StealthBurner status leds. You can change the status colors and led
# configurations for the logo and nozzle here.
variable_colors: {
        'logo': { # Colors for logo states
            'busy': {'r': 0.4, 'g': 0.0, 'b': 0.0, 'w': 0.0},
            'cleaning': {'r': 0.0, 'g': 0.02, 'b': 0.5, 'w': 0.0},
            'calibrating_z': {'r': 0.8, 'g': 0., 'b': 0.35, 'w': 0.0},
            'heating': {'r': 0.3, 'g': 0.18, 'b': 0.0, 'w': 0.0},
            'homing': {'r': 0.0, 'g': 0.6, 'b': 0.2, 'w': 0.0},
            'leveling': {'r': 0.5, 'g': 0.1, 'b': 0.4, 'w': 0.0},
            'meshing': {'r': 0.2, 'g': 1.0, 'b': 0.0, 'w': 0.0},
            'off': {'r': 0.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},
            'printing': {'r': 1.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},
            'standby': {'r': 0.01, 'g': 0.01, 'b': 0.01, 'w': 0.1},
        },
        'nozzle': { # Colors for nozzle states
            'heating': {'r': 0.8, 'g': 0.35, 'b': 0.0, 'w':0.0},
            'off': {'r': 0.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},
            'on': {'r': 0.8, 'g': 0.8, 'b': 0.8, 'w':1.0},
            'standby': {'r': 0.6, 'g': 0.0, 'b': 0.0, 'w':0.0},
        },
        'thermal': {
            'hot': {'r': 1.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},
            'cold': {'r': 0.3, 'g': 0.0, 'b': 0.3, 'w': 0.0}
        }
    }
variable_logo_led_name:         "sb_leds" 
# The name of the addressable LED chain that contains the logo LED(s)
variable_logo_idx:              "1" 
# A comma-separated list of indexes LEDs in the logo
variable_nozzle_led_name:       "sb_leds"
# The name of the addressable LED chain that contains the nozzle LED(s). This will
# typically be the same LED chain as the logo.
variable_nozzle_idx:            "2,3"
# A comma-separated list of indexes of LEDs in the nozzle

variable_thermal_config: {
        'extruder': {
            'cool_temp': 40,
            'leds': 'logo',
        },
        'heater_bed': {
            'cool_temp': 40,
            'leds': 'nozzle',
        },
    }
# temperatures at which cooling will be considered complete

gcode:
    ; Do nothing

[gcode_macro _set_sb_leds]
gcode:
    {% set red = params.RED|default(0)|float %}
    {% set green = params.GREEN|default(0)|float %}
    {% set blue = params.BLUE|default(0)|float %}
    {% set white = params.WHITE|default(0)|float %}
    {% set led = params.LED|string %}
    {% set idx = (params.IDX|string).split(',') %}
    {% set transmit_last = params.TRANSMIT|default(1) %}
    
    {% for led_index in idx %}
        {% set transmit=transmit_last if loop.last else 0 %}
        set_led led={led} red={red} green={green} blue={blue} white={white} index={led_index} transmit={transmit}
    {% endfor %}

[gcode_macro _set_sb_leds_by_name]
gcode:
    {% set leds_name = params.LEDS %}
    {% set color_name = params.COLOR %}
    {% set color = printer["gcode_macro _sb_vars"].colors[leds_name][color_name] %}
    {% set led = printer["gcode_macro _sb_vars"][leds_name + "_led_name"] %}
    {% set idx = printer["gcode_macro _sb_vars"][leds_name + "_idx"] %}
    {% set transmit = params.TRANSMIT|default(1) %}

    _set_sb_leds led={led} red={color.r} green={color.g} blue={color.b} white={color.w} idx="{idx}" transmit={transmit}

[gcode_macro _set_logo_leds]
gcode:
    {% set red = params.RED|default(0)|float %}
    {% set green = params.GREEN|default(0)|float %}
    {% set blue = params.BLUE|default(0)|float %}
    {% set white = params.WHITE|default(0)|float %}
    {% set led = printer["gcode_macro _sb_vars"].logo_led_name %}
    {% set idx = printer["gcode_macro _sb_vars"].logo_idx %}
    {% set transmit=params.TRANSMIT|default(1) %}

    _set_sb_leds led={led} red={red} green={green} blue={blue} white={white} idx="{idx}" transmit={transmit}

[gcode_macro _set_nozzle_leds]
gcode:
    {% set red = params.RED|default(0)|float %}
    {% set green = params.GREEN|default(0)|float %}
    {% set blue = params.BLUE|default(0)|float %}
    {% set white = params.WHITE|default(0)|float %}
    {% set led = printer["gcode_macro _sb_vars"].nozzle_led_name %}
    {% set idx = printer["gcode_macro _sb_vars"].nozzle_idx %}
    {% set transmit=params.TRANSMIT|default(1) %}

    _set_sb_leds led={led} red={red} green={green} blue={blue} white={white} idx="{idx}" transmit={transmit}

[gcode_macro set_logo_leds_off]
gcode:
    {% set transmit=params.TRANSMIT|default(1) %}
    _set_logo_leds red=0 blue=0 green=0 white=0 transmit={transmit}

[gcode_macro set_nozzle_leds_on]
gcode:
    {% set transmit=params.TRANSMIT|default(1) %}
    _set_sb_leds_by_name leds="nozzle" color="on" transmit={transmit}

[gcode_macro set_nozzle_leds_off]
gcode:
    {% set transmit=params.TRANSMIT|default(1) %}
    _set_sb_leds_by_name leds="nozzle" color="off" transmit={transmit}

[gcode_macro status_off]
gcode:
    set_logo_leds_off transmit=0
    set_nozzle_leds_off

[gcode_macro status_ready]
gcode:
    _set_sb_leds_by_name leds="logo" color="standby" transmit=0
    _set_sb_leds_by_name leds="nozzle" color="standby" transmit=1

[gcode_macro status_busy]
gcode:
    _set_sb_leds_by_name leds="logo" color="busy" transmit=0
    set_nozzle_leds_on

[gcode_macro status_heating]
gcode:
    _set_sb_leds_by_name leds="logo" color="heating" transmit=0
    _set_sb_leds_by_name leds="nozzle" color="heating" transmit=1

[gcode_macro status_leveling]
gcode:
    _set_sb_leds_by_name leds="logo" color="leveling" transmit=0
    set_nozzle_leds_on

[gcode_macro status_homing]
gcode:
    _set_sb_leds_by_name leds="logo" color="homing" transmit=0
    set_nozzle_leds_on

[gcode_macro status_cleaning]
gcode:
    _set_sb_leds_by_name leds="logo" color="cleaning" transmit=0
    set_nozzle_leds_on

[gcode_macro status_meshing]
gcode:
    _set_sb_leds_by_name leds="logo" color="meshing" transmit=0
    set_nozzle_leds_on

[gcode_macro status_calibrating_z]
gcode:
    _set_sb_leds_by_name leds="logo" color="calibrating_z" transmit=0
    set_nozzle_leds_on

[gcode_macro status_printing]
gcode:
    _set_sb_leds_by_name leds="logo" color="printing" transmit=0
    set_nozzle_leds_on
[delayed_gcode set_stealthburner_led]
initial_duration: 2
gcode:
    status_ready


#####################################################################
# СТАРТ / КОНЕЦ / ПАУЗА (эталон 3Def + Cartographer / Orca)
#####################################################################

[gcode_macro _USER_VARIABLES]
variable_probe_max_temp: 150
variable_bed_center_x: 250
variable_bed_center_y: 250
variable_adaptive_margin: 10
variable_pause_park_x: 250
variable_pause_park_y: 80
variable_post_clean_retract: 4.0
variable_gcode_z_offset: -0.03
gcode:

[gcode_macro CARTO_CALIBRATE]
description: Подсказка по калибровке Cartographer
gcode:
    RESPOND MSG="1) CARTOGRAPHER_SCAN_CALIBRATE → SAVE_CONFIG"
    RESPOND MSG="2) G28 Z → QUAD_GANTRY_LEVEL → G28 Z"
    RESPOND MSG="3) CARTOGRAPHER_TOUCH_CALIBRATE → SAVE_CONFIG"

[gcode_macro G32]
description: G28 + QGL + Z (сопло ≤150°C для Cartographer touch)
gcode:
    {% set probe_temp = printer["gcode_macro _USER_VARIABLES"].probe_max_temp|float %}
    {% set cx = printer["gcode_macro _USER_VARIABLES"].bed_center_x|float %}
    {% set cy = printer["gcode_macro _USER_VARIABLES"].bed_center_y|float %}
    BED_MESH_CLEAR
    status_homing
    G28
    status_heating
    M104 S{probe_temp}
    M109 S{probe_temp}
    status_leveling
    QUAD_GANTRY_LEVEL
    G28 Z
    G0 X{cx} Y{cy} Z30 F3600
    status_ready

[gcode_macro MESH]
description: Ручная сетка; ADAPTIVE=1 — exclude_object; SAVE=1 — SAVE_CONFIG
gcode:
    {% set adaptive = params.ADAPTIVE|default(0)|int %}
    {% set margin = printer["gcode_macro _USER_VARIABLES"].adaptive_margin|int %}
    {% if adaptive %}
        BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN={margin}
    {% else %}
        BED_MESH_CALIBRATE
    {% endif %}
    {% if params.SAVE|default(0)|int %}
        SAVE_CONFIG
    {% endif %}

[gcode_macro PRINT_START]
description: Старт печати (3Def + Orca adaptive mesh + Cartographer touch)
gcode:
    CLEAR_PAUSE
    SET_FILAMENT_SENSOR SENSOR=Пластик ENABLE=0
    {% set bedtemp = params.BED_TEMP|default(params.BED|default(60))|int %}
    {% set hotendtemp = params.EXTRUDER_TEMP|default(params.EXTRUDER|default(200))|int %}
    {% set probe_temp = printer["gcode_macro _USER_VARIABLES"].probe_max_temp|float %}
    onled
    status_ready
    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0
    status_homing
    G28
    G90
    status_heating
    M104 S{probe_temp}
    M140 S{bedtemp}
    M190 S{bedtemp}
    M109 S{probe_temp}
    status_leveling
    QUAD_GANTRY_LEVEL
    G28 Z
    status_calibrating_z
    CARTOGRAPHER_TOUCH_HOME
    status_meshing
    {% if params.MESH_MIN_X is defined %}
        BED_MESH_CALIBRATE mesh_min={params.MESH_MIN_X|float},{params.MESH_MIN_Y|float} mesh_max={params.MESH_MAX_X|float},{params.MESH_MAX_Y|float} ALGORITHM={params.MESH_ALGO|default("bicubic")} PROBE_COUNT={params.PROBE_COUNT_X|int},{params.PROBE_COUNT_Y|int} ADAPTIVE=0 ADAPTIVE_MARGIN=0
    {% else %}
        BED_MESH_CALIBRATE
    {% endif %}
    {% set z_off = printer["gcode_macro _USER_VARIABLES"].gcode_z_offset|float %}
    SET_GCODE_OFFSET Z={z_off}
    M104 S{hotendtemp}
    M109 S{hotendtemp}
    status_cleaning
    SET_GCODE_VARIABLE MACRO=clean_nozzle VARIABLE=wipe_qty VALUE=10
    SET_GCODE_VARIABLE MACRO=clean_nozzle VARIABLE=brush_segments VALUE=3
    SET_GCODE_VARIABLE MACRO=clean_nozzle VARIABLE=purge_ret VALUE=5
    clean_nozzle
    {% set retract = printer["gcode_macro _USER_VARIABLES"].post_clean_retract|float %}
    M83
    G1 E-{retract} F2400
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
    G91
    G1 Z4 F6000
    G90
    status_printing
    G1 X5 Y3 F18000
    G1 Z0.28 F1200
    M83
    G1 E2 F600
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
    G92 E0
    G1 X450 Y3 E38 F3600
    G1 Z0.5 F200
    G92 E0
    SET_PIN PIN=beeper VALUE=1
    G4 P3000
    SET_PIN PIN=beeper VALUE=0
    SET_FILAMENT_SENSOR SENSOR=Пластик ENABLE=1

[gcode_macro SET_FIRST_LAYER_Z]
description: Подстройка Z первого слоя (мм, отрицательное = ближе к столу)
gcode:
    {% set z = params.Z|default(printer["gcode_macro _USER_VARIABLES"].gcode_z_offset)|float %}
    SET_GCODE_VARIABLE MACRO=_USER_VARIABLES VARIABLE=gcode_z_offset VALUE={z}
    SET_GCODE_OFFSET Z={z}
    M117 First layer Z offset {z}

[gcode_macro PRINT_END]
description: Конец печати (3Def, без автоотключения питания)
gcode:
    M400
    G92 E0
    G91
    G0 Z1.00 X20.0 Y20.0 F6000
    TURN_OFF_HEATERS
    M107
    G1 Z2 F3000
    G90
    G0 X495 Y495 F3600
    BED_MESH_CLEAR
    NEVERMORE_ON
    EXHAUST_ON
    UPDATE_DELAYED_GCODE ID=exhaust_off DURATION=600
    SET_PIN PIN=beeper VALUE=1
    G4 P3000
    SET_PIN PIN=beeper VALUE=0
    G4 P3000
    SET_PIN PIN=beeper VALUE=1
    G4 P3000
    SET_PIN PIN=beeper VALUE=0

[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Парковка при PAUSE / CANCEL_PRINT
variable_extrude: 1.5
gcode:
    {% set u = printer["gcode_macro _USER_VARIABLES"] %}
    {% set x_park = u.pause_park_x|float %}
    {% set y_park = u.pause_park_y|float %}
    {% set z_park_delta = 2.0 %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - z_park_delta) %}
        {% set z_safe = z_park_delta %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    {% if printer.extruder.can_extrude|lower == 'true' %}
        M83
        G1 E-{extrude} F2100
        {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
    {% else %}
        {action_respond_info("Extruder not hot enough")}
    {% endif %}
    {% if "xyz" in printer.toolhead.homed_axes %}
        G91
        G1 Z{z_safe} F900
        G90
        G1 X{x_park} Y{y_park} F6000
        {% if printer.gcode_move.absolute_coordinates|lower == 'false' %} G91 {% endif %}
    {% else %}
        {action_respond_info("Printer not homed")}
    {% endif %}

[gcode_macro PAUSE]
description: Пауза печати
rename_existing: BASE_PAUSE
gcode:
    BASE_PAUSE
    _TOOLHEAD_PARK_PAUSE_CANCEL

[gcode_macro RESUME]
description: Продолжить печать
rename_existing: BASE_RESUME
gcode:
    {% set extrude = printer['gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL'].extrude %}
    {% if 'VELOCITY' in params|upper %}
        {% set get_params = ('VELOCITY=' + params.VELOCITY) %}
    {% else %}
        {% set get_params = "" %}
    {% endif %}
    {% if printer.extruder.can_extrude|lower == 'true' %}
        M83
        G1 E{extrude} F2100
        {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
    {% else %}
        {action_respond_info("Extruder not hot enough")}
    {% endif %}
    BASE_RESUME {get_params}

[gcode_macro CANCEL_PRINT]
description: Отмена печати
rename_existing: BASE_CANCEL_PRINT
variable_park: True
gcode:
    {% if printer.pause_resume.is_paused|lower == 'false' and park|lower == 'true' %}
        _TOOLHEAD_PARK_PAUSE_CANCEL
    {% endif %}
    TURN_OFF_HEATERS
    BASE_CANCEL_PRINT

[gcode_macro LOAD_FILAMENT]
variable_load_distance: 100
variable_purge_distance: 25
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity * 60 %}
    SAVE_GCODE_STATE NAME=load_state
    SET_FILAMENT_SENSOR SENSOR=Пластик ENABLE=0
    G91
    G92 E0
    G1 E{load_distance} F{max_velocity}
    G1 E{purge_distance} F{speed}
    SET_FILAMENT_SENSOR SENSOR=Пластик ENABLE=1
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance: 100
variable_purge_distance: 25
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity * 60 %}
    SAVE_GCODE_STATE NAME=unload_state
    G91
    G92 E0
    G1 E{purge_distance} F{speed}
    G1 E-{unload_distance} F{max_velocity}
    RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro SGTHRS_TEST]
description: Тест sensorless — SGTHRS_TEST AXIS=X VALUE=80
gcode:
    {% set axis = params.AXIS|default('X')|upper %}
    {% set val = params.VALUE|default(80)|int %}
    {% if axis == 'X' %}
        SET_TMC_FIELD STEPPER=stepper_x FIELD=SGTHRS VALUE={val}
    {% elif axis == 'Y' %}
        SET_TMC_FIELD STEPPER=stepper_y FIELD=SGTHRS VALUE={val}
    {% else %}
        { action_raise_error("AXIS must be X or Y") }
    {% endif %}
    M117 {axis} SGTHRS={val}
    G28 {axis}

#####################################################################
# ОЧИСТКА СОПЛА (эталон 3Def nozzle_scrub.cfg)
#####################################################################

[gcode_macro clean_nozzle]

# Если вы устанавливаете щетку и ведерко в задней левой части кровати в соответствии с установкой по умолчанию,
# установите значение True в variable_location_bucket_rear. Если вы хотите разместить ведро для очистки в
# другом месте (возможно, спереди), установите значение False. Смотрите диаграммы и описание ниже о том, как задать положение XY.
variable_location_bucket_rear:      False

# Если вы хотите, чтобы продувка в ваше ведерко была включена, установите значение True (и наоборот).
variable_enable_purge:              True

# Если вы хотите включить продувку при охлаждении, установите значение True (и наоборот).
variable_enable_hotcold:            True

#####################################################################
#                       Настройка продувки
#####################################################################
# Данные параметры настраивают параметры для продувки (выдавливания некоторого объёма пластика).
# variable_purge_ret указывает на длину ретракта сразу после продувки и предотвращает протекание пластика. 
# Некоторые пластики продолжают сочиться секунду - другую после втягивания, переменная variable_ooze_dwell
# позволяет учесть это.
variable_purge_len:            10	         # Длина пластика, который будет выдавлен во время продувки, в мм.
variable_purge_spd:           150	         # Скорость продувки в миллиметрах в минуту.
variable_purge_temp_min:      170	         # Минимальная температура сопла для продувки. Если температура ниже, продувка не будет выполняться.
variable_purge_ret:             5            # Длина ретракта сразу после продувки.
variable_ooze_dwell:            1            # Время задержки в секундах после продувки и ретракта, перед очисткой сопла.


#####################################################################
#                       Настройка очистки
#####################################################################
# Отрегулируйте это значение так, чтобы сопло ходило по щётке. В целях безопасности значение по умолчанию 
# установлено намного выше. Будьте осторожны, не опускайтесь слишком низко!
variable_brush_top:            2             # Высота по Z, при которой сопло ходит по щётке
variable_brush_deep_max:       2             # Максимальная глубина погружения сопла ОТНОСИТЕЛЬНО СТОЛА

# Эти параметры настраивают ваш процесс очистки, скорость перемещения, безопасный зазор по оси Z и количество проходов сопла по щётке.
# Направление очистки (слева на право или справо на лево) выбирается в зависимости от того,
# какое ведро для продувки было выбранно случайным образом - левое или правое.
variable_clearance_z:           5	         # Зазор по оси Z между соплом и щёткой при холостом ходе (когда спо)
variable_wipe_qty:              10	         # Количество проходов сопла по щётке.
variable_prep_spd_xy:        18000	         # Скорость холостого перемещения (когда сопло не идёт по щётке) по X и Y в мм/мин.
variable_prep_spd_z:         6000	         # Скорость холостого перемещения (когда сопло не идёт по щётке) по Z в мм/мин.
variable_wipe_spd_xy:        12000	         # Скорость очистки (сопло идёт по щётке).


#####################################################################
#                       Настройка щётки
#####################################################################
# Эти параметры определяют размеры щётки для очистки сопла. Измените их под свою щётку. Визуальные схема приведена ниже.
# Обратите внимание, что ориентация параметров остается одинаковой независимо от того, находится ли щётка сзади или спереди.
# 
#                  ←   brush_width   →                            
#                   _________________                                                          ↑
#                  |                 |  ↑                     Если вы указали location_bucket_rear = True, координата Y будет получена из
#  brush_start (x) |                 | brush_depth            вашей секции stepper_y параметра position_max. Настройте данный параметр,
#                  |_________________|  ↓                       что бы сопло ходило по щётке или укажите location_bucket_rear = False.       
#                          (y)                                                                 ↓
#                      brush_front
# __________________________________________________________
#                     PRINTER FRONT
# 
# 

# Укажите начало вашей щётки по оси X
variable_brush_start:     370

# Укажите ширину вашей щётки по оси X
variable_brush_width:      42	

# Данные параметры применяются только если у вас выставленно location_bucket_rear = False.
# Укажите значение по оси Y где начинается ваша щётка
variable_brush_front:       494          
variable_brush_depth:       1          

# Укажите количество сегментов щётки и сопло будет подниматься и опускаться между сегментами для лучшей очистки.
# ВНИМАНИЕ! Сильно увеличивает время очистки. По умолчанию 1.
variable_brush_segments:    3          
        

#####################################################################
#                       Настройка ведёрок для продувки
#####################################################################
# Данные параметры настраивают размеры и положение ваших ведёрок для очистки. Настройте их для себя. 
# Если вы не включили продувку, то можете игнорировать данню секцию. Схема представлена ниже. 
# Обратите внимание, что ориентация параметров остается одинаковой независимо от того, находится ли щётка сзади или спереди.
# 
#                                     bucket_gap
#                                      ← ---- →
#                     __________________________________________
#                    |                 |      |                 |      
#                    |                 |      |                 |
#  bucket_start (x)  |                 |______|                 |
#                    |                 |      |                 |
#                    |                 |      |                 |
#                    |_________________|. . . |_________________|
#                     ← ------------- →        ← ------------- →
#                     bucket_left_width        bucket_right_width
#  _______________________________________________________________________________________
#                                    PRINTER FRONT
# 

## Укажите ширину левого ведёрка
variable_bucket_left_width:    37

# Укажите ширину зазора между ведёрками variable_bucket_right_width и ширину правого ведёрка variable_bucket_gap.
variable_bucket_right_width:   35            
variable_bucket_gap:           25	

# For V1.8, you may need to measure where your bucket start is and input into bucket_start. Otherwise, a value of 0 is for a default
# installation of purge bucket at rear left.
variable_bucket_start:         348


###############################################################################################################################################
###############################################################################################################################################

### В блок ниже вносить изменения не реккомендуется!!!!!!

###############################################################################################################################################
###############################################################################################################################################

# Placeholder. The variable will later be set to contain, at random, a number representing the left or right bucket.
variable_bucket_pos:            1	        

gcode:
   # First, check if the axes are homed.
   {% if "xyz" in printer.toolhead.homed_axes %}

      ## Save the gcode state in this macro instance.
      SAVE_GCODE_STATE NAME=clean_nozzle

      ## Set to absolute positioning.
      G90

      ## Grab max position of Y-axis from config to use in setting a fixed y position for location_bucket_rear = True.
      {% set Ry = printer.configfile.config["stepper_y"]["position_max"]|float %}

      ## Check if user enabled purge option or not.
      {% if enable_purge %}

         ### Randomly select left or right bin for purge. 0 = left, 1 = right
         SET_GCODE_VARIABLE MACRO=clean_nozzle VARIABLE=bucket_pos VALUE={(range(2) | random)}

         ### Raise Z for travel.
         G1 Z{brush_top + clearance_z} F{prep_spd_z}

         ### Check if user chose to use rear location.
         {% if location_bucket_rear %}
            G1 Y{Ry} F{prep_spd_xy}
         {% else %}
            G1 Y{brush_front + (brush_depth / 2)} F{prep_spd_xy}
         {% endif %}

         ### Position for purge. Randomly selects middle of left or right bucket. It references from the middle of the left bucket.
         G1 X{bucket_start + (bucket_left_width / (2 - bucket_pos)) + (bucket_pos * bucket_gap) + (bucket_pos * (bucket_right_width / 2))}

         ### Perform purge if the temp is up to min temp. If not, it will skip and continue executing rest of macro. Small retract after
         ### purging to minimize any persistent oozing at 5x purge_spd. G4 dwell is in milliseconds, hence * 1000 in formula.
         {% if printer.extruder.temperature >= purge_temp_min %}
            M83      ; relative mode
            G1 E{purge_len} F{purge_spd}
            G1 E-{purge_ret} F{purge_spd * 5}
            G4 P{ooze_dwell * 1000}
            G92 E0   ; reset extruder
      {% endif %}

      {% endif %}

      ## Set wipe backoffice
      {% set brush_step = brush_width / brush_segments %}
      {% set brush_lanes = [ brush_front, brush_front+brush_depth/3, brush_front+brush_depth/3*2, brush_front+brush_depth ] %}
      {% set brush_zhop  = (brush_top - brush_deep_max) /5 %}
      {% set brush_hops  = [ brush_top, brush_top-brush_zhop, brush_top-brush_zhop*2, brush_top-brush_zhop*3, brush_top-brush_zhop*4, brush_top-brush_zhop*5 ] %}

      ## Position for wipe. Either left or right of brush based off bucket_pos to avoid unnecessary travel.
      G1 Z{brush_top + clearance_z} F{prep_spd_z}
      G1 X{brush_start + (brush_width * bucket_pos)} F{prep_spd_xy}

      ## Check if user chose to use rear location.
      {% if location_bucket_rear %}
         G1 Y{Ry}
      {% else %}
         G1 Y{brush_front + (brush_depth / 2)}
      {% endif %}

      ## Move nozzle down into brush.
      G1 Z{brush_top} F{prep_spd_z}
   
      ## Perform wipe. Wipe direction based off bucket_pos for cool random scrubby routine.
      G1 F{wipe_spd_xy}
      SET_GCODE_VARIABLE MACRO=_clean_nozzle_move  VARIABLE=move VALUE=True
      {% for wipes in range(1, (wipe_qty + 1)) %}
          {%for segments in range(1, (brush_segments+1)) %}
              _clean_nozzle_move X={brush_start + brush_width*bucket_pos + (1-2*bucket_pos)*brush_step*segments } Y={brush_lanes[range(4)|random]} Z={brush_hops[range(6)|random]}
          {% endfor %}
          {%for segments in range(1, (brush_segments+1)) %}
              _clean_nozzle_move X={brush_start + brush_width*(1-bucket_pos) - (1-2*bucket_pos)*brush_step*segments } Y={brush_lanes[range(4)|random]} Z={brush_hops[range(6)|random]}
          {% endfor %}
          {% if enable_hotcold == True %}
              _clean_nozzle_cooldown_check
          {% endif %}
      {% endfor %}

   
      ## Clear from area — retract before travel to avoid ooze
      M117 Cleaned!
      G1 Z{brush_top + clearance_z} F{prep_spd_z}
      M83
      G1 E-4 F2400
      G92 E0
      G91
      G1 X{bucket_left_width / 4} F{prep_spd_xy}

      ## Restore the gcode state to how it was before the macro.
      RESTORE_GCODE_STATE NAME=clean_nozzle

   {% else %}

      ## raise error will stop any macros that clean_nozzle is referenced in from proceeding for safety.
      { action_raise_error("Please home your axes!") }
      M117 Please home first!

   {% endif %}


###############################################################################################################################################
###############################################################################################################################################

[gcode_macro _clean_nozzle_move]
variable_move: True
gcode:
    
    {% if move == True %}
          {% set x = params.X %}
          {% set y = params.Y %}
          {% set z = params.Z %}
          G1 X{x} Y{y} Z{z}
    {% endif %}

[gcode_macro  _clean_nozzle_cooldown_check]
gcode:
  {% set extruder_temperature = printer[printer.toolhead.extruder].temperature %}
  {% set extruder_target = printer[printer.toolhead.extruder].target %}
  {% if extruder_temperature <= extruder_target %}
        SET_GCODE_VARIABLE MACRO=_clean_nozzle_move  VARIABLE=move VALUE=False
  {% endif %}

###############################################################################################################################################
###############################################################################################################################################

[gcode_macro CLEAN_HOTCOLD]
variable_temperature_offset:   30 
gcode:
    {% set extruder_target = printer[printer.toolhead.extruder].target %}
    {% set extruder_temperature = printer[printer.toolhead.extruder].temperature %}
    {% set cooltemp_target = extruder_target - temperature_offset %}
    {% set min_extrude_temp = printer.configfile.settings.extruder.min_extrude_temp %}
    {% if extruder_target >= min_extrude_temp and extruder_temperature >= min_extrude_temp %}
        SAVE_GCODE_STATE NAME=STATE_CLEAN
        SET_GCODE_OFFSET Z=0.0                                                        ; reset the G-Code Z offset (adjust Z offset if needed)
        SET_GCODE_VARIABLE MACRO=clean_nozzle  VARIABLE=wipe_qty VALUE=100            ; do enough wipes so the nozzle has time to cool down
        SET_GCODE_VARIABLE MACRO=clean_nozzle  VARIABLE=enable_purge VALUE=False      ; no purge
        SET_GCODE_VARIABLE MACRO=clean_nozzle  VARIABLE=enable_hotcold VALUE=True     ; hot to cold cleaning
        M109 S{extruder_target}                                                       ; wait for extruder to reach the target temperature
        M104 S{cooltemp_target}                                                       ; cool down during wipes to prevent oozing after wipes
        M106 S256                                                                     ; set fan speed to max to help cooling
        G4 P{10 * 1000}                                                               ; dwell time to spare nozzle a bit
        CLEAN_NOZZLE                                                                  ; start cleaning
        M106 S0                                                                       ; stop part cooling fan
        SET_GCODE_VARIABLE MACRO=clean_nozzle  VARIABLE=enable_hotcold VALUE=False    ; hot to cold cleaning off
        RESTORE_GCODE_STATE NAME=STATE_CLEAN
    {% endif %}

[gcode_macro CLEAN_PURGE]
gcode:
    SAVE_GCODE_STATE NAME=STATE_CLEAN
    SET_GCODE_OFFSET Z=0.0  
    SET_GCODE_VARIABLE MACRO=clean_nozzle  VARIABLE=wipe_qty VALUE=5
    SET_GCODE_VARIABLE MACRO=clean_nozzle  VARIABLE=enable_purge VALUE=True
    SET_GCODE_VARIABLE MACRO=clean_nozzle  VARIABLE=purge_len VALUE=100
    CLEAN_NOZZLE
    RESTORE_GCODE_STATE NAME=STATE_CLEAN

[gcode_macro CLEAN_PRIME]
gcode:
    SAVE_GCODE_STATE NAME=STATE_CLEAN
    SET_GCODE_OFFSET Z=0.0  
    SET_GCODE_VARIABLE MACRO=clean_nozzle  VARIABLE=wipe_qty VALUE=5
    SET_GCODE_VARIABLE MACRO=clean_nozzle  VARIABLE=enable_purge VALUE=True
    SET_GCODE_VARIABLE MACRO=clean_nozzle  VARIABLE=purge_len VALUE=25
    CLEAN_NOZZLE
    RESTORE_GCODE_STATE NAME=STATE_CLEAN

[gcode_macro CLEAN_NOPURGE]
gcode:
    SAVE_GCODE_STATE NAME=STATE_CLEAN
    SET_GCODE_OFFSET Z=0.0  
    SET_GCODE_VARIABLE MACRO=clean_nozzle  VARIABLE=wipe_qty VALUE=3
    SET_GCODE_VARIABLE MACRO=clean_nozzle  VARIABLE=enable_purge VALUE=False
    CLEAN_NOZZLE
    RESTORE_GCODE_STATE NAME=STATE_CLEAN
