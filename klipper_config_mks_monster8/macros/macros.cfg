#####################################################################
# Макросы Voron 2.4 Gr1mSkull — Kalico + Cartographer 3D
# PRINT_START: https://docs.cartographer3d.com/.../print_start-template
#####################################################################

[gcode_macro _USER_VARIABLES]
variable_probe_max_temp: 150
variable_bed_center_x: 250
variable_bed_center_y: 250
variable_adaptive_margin: 10
# Продувочная линия (передний край стола 500×500, слева)
variable_purge_x_start: 50
variable_purge_x_end: 150
variable_purge_y: 20
variable_purge_z: 0.2
variable_purge_extrude: 35
variable_purge_feedrate: 1500
variable_use_physical_endstops: True
variable_verbose: True
gcode:
    # SET_GCODE_VARIABLE MACRO=_USER_VARIABLES VARIABLE=purge_y VALUE=25

#####################################################################
# Подсветка / вентиляция
#####################################################################

[gcode_macro LIGHTS_ON]
description: Включить подсветку камеры
gcode:
    SET_PIN PIN=caselight VALUE=1

[gcode_macro LIGHTS_OFF]
description: Выключить подсветку камеры
gcode:
    SET_PIN PIN=caselight VALUE=0

[gcode_macro LIGHTS_TOGGLE]
description: Переключить подсветку
gcode:
    {% if printer['output_pin caselight'].value > 0.5 %}
        SET_PIN PIN=caselight VALUE=0
    {% else %}
        SET_PIN PIN=caselight VALUE=1
    {% endif %}

[gcode_macro NEVERMORE_ON]
description: Включить Nevermore (угольный фильтр)
gcode:
    SET_FAN_SPEED FAN=nevermore SPEED=1.0

[gcode_macro NEVERMORE_OFF]
description: Выключить Nevermore
gcode:
    SET_FAN_SPEED FAN=nevermore SPEED=0

[gcode_macro EXHAUST_ON]
description: Включить вытяжку
gcode:
    SET_FAN_SPEED FAN=exhaust_fan SPEED=1.0

[gcode_macro EXHAUST_OFF]
description: Выключить вытяжку
gcode:
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0

[gcode_macro STEALTH_LED]
description: Stealthburner LED — R G B W (0-1)
gcode:
    {% set r = params.R|default(0.3)|float %}
    {% set g = params.G|default(0.3)|float %}
    {% set b = params.B|default(0.3)|float %}
    {% set w = params.W|default(0.0)|float %}
    SET_LED LED=sb_leds RED={r} GREEN={g} BLUE={b} WHITE={w} SYNC=1

#####################################################################
# Homing / калибровка
#####################################################################

[gcode_macro G32]
description: Homing XY + QGL + повторный Z (без mesh)
gcode:
    BED_MESH_CLEAR
    G28
    QUAD_GANTRY_LEVEL
    G28 Z
    G0 X{printer["gcode_macro _USER_VARIABLES"].bed_center_x} Y{printer["gcode_macro _USER_VARIABLES"].bed_center_y} Z30 F3600

[gcode_macro MESH]
description: Сетка стола (scan); ADAPTIVE=1 если в слайсере заданы объекты
gcode:
    {% set adaptive = params.ADAPTIVE|default(0)|int %}
    {% set margin = printer["gcode_macro _USER_VARIABLES"].adaptive_margin|int %}
    {% if adaptive %}
        BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN={margin}
    {% else %}
        BED_MESH_CALIBRATE
    {% endif %}
    SAVE_CONFIG

[gcode_macro _PURGE_LINE]
description: Продувочная линия перед печатью (внутренний макрос)
gcode:
    {% set u = printer["gcode_macro _USER_VARIABLES"] %}
    {% set x0 = u.purge_x_start|float %}
    {% set x1 = u.purge_x_end|float %}
    {% set y = u.purge_y|float %}
    {% set z = u.purge_z|float %}
    {% set e = u.purge_extrude|float %}
    {% set f = u.purge_feedrate|float %}
    M117 Purge line...
    G90
    G92 E0
    G1 Z5 F3000
    G1 X{x0} Y{y} Z5 F12000
    G1 Z{z} F600
    G1 X{x0} Y{y} F6000
    G1 X{x1} Y{y} E{e} F{f}
    G1 Z5 F3000
    G92 E0

[gcode_macro PURGE_LINE]
description: Ручная продувочная линия (тест без PRINT_START)
gcode:
    _PURGE_LINE

#####################################################################
# Печать — порядок по документации Cartographer
#####################################################################

[gcode_macro PRINT_START]
description: Старт печати — Cartographer scan homing + touch home + mesh
gcode:
    {% set bed_temp = params.BED_TEMP|default(60)|float %}
    {% set extruder_temp = params.EXTRUDER_TEMP|default(200)|float %}
    {% set probe_temp = printer["gcode_macro _USER_VARIABLES"].probe_max_temp|float %}
    {% set cx = printer["gcode_macro _USER_VARIABLES"].bed_center_x|float %}
    {% set cy = printer["gcode_macro _USER_VARIABLES"].bed_center_y|float %}
    LIGHTS_ON
    SET_GCODE_OFFSET Z=0
    BED_MESH_CLEAR
    G28
    G90
    # Смягчить остатки филамента; touch/mesh — не выше probe_max_temp
    M104 S{probe_temp}
    M140 S{bed_temp}
    M190 S{bed_temp}
    QUAD_GANTRY_LEVEL
    G28 Z
    M109 S{probe_temp}
    CARTOGRAPHER_TOUCH_HOME
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN={printer["gcode_macro _USER_VARIABLES"].adaptive_margin|int}
    M104 S{extruder_temp}
    M109 S{extruder_temp}
    _PURGE_LINE
    G1 Z5 F3000
    G0 X{cx} Y{cy} F6000
    M117 Printing...

[gcode_macro PRINT_END]
description: Завершение печати
gcode:
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    M400
    G92 E0
    G1 E-8.0 F3600
    G91
    G0 Z2.0 X20.0 Y20.0 F20000
    TURN_OFF_HEATERS
    M107
    G90
    G0 X250 Y480 F6000
    BED_MESH_CLEAR
    NEVERMORE_ON
    EXHAUST_ON
    UPDATE_DELAYED_GCODE ID=exhaust_off DURATION=600
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

[delayed_gcode exhaust_off]
gcode:
    EXHAUST_OFF
    NEVERMORE_OFF

[gcode_macro CANCEL_PRINT]
description: Отмена печати
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    M107
    BED_MESH_CLEAR
    G91
    G0 Z10 F600
    G90
    G0 X250 Y480 F6000
    LIGHTS_OFF
    EXHAUST_ON
    UPDATE_DELAYED_GCODE ID=exhaust_off DURATION=300
    BASE_CANCEL_PRINT

[gcode_macro PAUSE]
description: Пауза печати
rename_existing: BASE_PAUSE
gcode:
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 Z10 F600
    G90
    G0 X250 Y480 F6000

[gcode_macro RESUME]
description: Продолжить печать
rename_existing: BASE_RESUME
gcode:
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=100
    BASE_RESUME

#####################################################################
# Sensorless tuning
#####################################################################

[gcode_macro SGTHRS_TEST]
description: Тест sensorless — SGTHRS_TEST AXIS=X VALUE=80
gcode:
    {% set axis = params.AXIS|default('X')|upper %}
    {% set val = params.VALUE|default(80)|int %}
    {% if axis == 'X' %}
        SET_TMC_FIELD STEPPER=stepper_x FIELD=SGTHRS VALUE={val}
    {% elif axis == 'Y' %}
        SET_TMC_FIELD STEPPER=stepper_y FIELD=SGTHRS VALUE={val}
    {% else %}
        { action_raise_error("AXIS must be X or Y") }
    {% endif %}
    M117 {axis} SGTHRS={val}
    G28 {axis}
