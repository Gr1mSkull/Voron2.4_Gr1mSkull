#####################################################################
# Макросы Voron 2.4 Gr1mSkull
#####################################################################

[gcode_macro _USER_VARIABLES]
variable_use_cartographer: True
variable_use_physical_endstops: True
variable_verbose: True
gcode:
    # Переменные для кастомизации; меняйте через SET_GCODE_VARIABLE
    # (имя _CLIENT_VARIABLE зарезервировано Mainsail/Fluidd — не используем его)

#####################################################################
# Подсветка / вентиляция
#####################################################################

[gcode_macro LIGHTS_ON]
description: Включить подсветку камеры
gcode:
    SET_PIN PIN=caselight VALUE=1

[gcode_macro LIGHTS_OFF]
description: Выключить подсветку камеры
gcode:
    SET_PIN PIN=caselight VALUE=0

[gcode_macro LIGHTS_TOGGLE]
description: Переключить подсветку
gcode:
    {% if printer['output_pin caselight'].value > 0.5 %}
        SET_PIN PIN=caselight VALUE=0
    {% else %}
        SET_PIN PIN=caselight VALUE=1
    {% endif %}

[gcode_macro NEVERMORE_ON]
description: Включить Nevermore (угольный фильтр)
gcode:
    SET_FAN_SPEED FAN=nevermore SPEED=1.0

[gcode_macro NEVERMORE_OFF]
description: Выключить Nevermore
gcode:
    SET_FAN_SPEED FAN=nevermore SPEED=0

[gcode_macro EXHAUST_ON]
description: Включить вытяжку
gcode:
    SET_FAN_SPEED FAN=exhaust_fan SPEED=1.0

[gcode_macro EXHAUST_OFF]
description: Выключить вытяжку
gcode:
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0

[gcode_macro STEALTH_LED]
description: Stealthburner LED — R G B W (0-1)
gcode:
    {% set r = params.R|default(0.3)|float %}
    {% set g = params.G|default(0.3)|float %}
    {% set b = params.B|default(0.3)|float %}
    {% set w = params.W|default(0.0)|float %}
    SET_LED LED=sb_leds RED={r} GREEN={g} BLUE={b} WHITE={w} SYNC=1

#####################################################################
# Homing / калибровка
#####################################################################

[gcode_macro G32]
description: Полный цикл homing + QGL
gcode:
    BED_MESH_CLEAR
    G28
    QUAD_GANTRY_LEVEL
    G28
    G0 X250 Y250 Z30 F3600

[gcode_macro MESH]
description: Калибровка сетки стола + сохранение
gcode:
    BED_MESH_CALIBRATE
    SAVE_CONFIG

#####################################################################
# Печать
#####################################################################

[gcode_macro PRINT_START]
description: Стартовый макрос слайсера — BED TEMP, EXTRUDER TEMP и т.д.
gcode:
    {% set bed_temp = params.BED_TEMP|default(60)|float %}
    {% set extruder_temp = params.EXTRUDER_TEMP|default(200)|float %}
    LIGHTS_ON
    # 1) Греем стол и сопло только до температуры пробинга (Tap требует <=150°C)
    M140 S{bed_temp}
    M104 S150
    M190 S{bed_temp}
    M109 S150
    # 2) Хоуминг, QGL и сетка — всё на 150°C
    G32
    BED_MESH_CALIBRATE
    # 3) Только теперь нагрев до рабочей температуры
    M117 Heating nozzle...
    M104 S{extruder_temp}
    M109 S{extruder_temp}
    G92 E0
    G1 Z5 F3000
    M117 Printing...

[gcode_macro PRINT_END]
description: Завершение печати
gcode:
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    M400
    G92 E0
    G1 E-8.0 F3600
    G91
    G0 Z2.0 X20.0 Y20.0 F20000
    TURN_OFF_HEATERS
    M107
    G90
    G0 X250 Y480 F6000
    BED_MESH_CLEAR
    NEVERMORE_ON
    EXHAUST_ON
    UPDATE_DELAYED_GCODE ID=exhaust_off DURATION=600
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

[delayed_gcode exhaust_off]
gcode:
    EXHAUST_OFF
    NEVERMORE_OFF

[gcode_macro CANCEL_PRINT]
description: Отмена печати
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    M107
    BED_MESH_CLEAR
    G91
    G0 Z10 F600
    G90
    G0 X250 Y480 F6000
    LIGHTS_OFF
    EXHAUST_ON
    UPDATE_DELAYED_GCODE ID=exhaust_off DURATION=300
    BASE_CANCEL_PRINT

[gcode_macro PAUSE]
description: Пауза печати
rename_existing: BASE_PAUSE
gcode:
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 Z10 F600
    G90
    G0 X250 Y480 F6000

[gcode_macro RESUME]
description: Продолжить печать
rename_existing: BASE_RESUME
gcode:
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=100
    BASE_RESUME

#####################################################################
# Sensorless tuning helpers
#####################################################################

[gcode_macro SGTHRS_TEST]
description: Тест sensorless — SGTHRS_TEST AXIS=X VALUE=80
gcode:
    {% set axis = params.AXIS|default('X')|upper %}
    {% set val = params.VALUE|default(80)|int %}
    {% if axis == 'X' %}
        SET_TMC_FIELD STEPPER=stepper_x FIELD=SGTHRS VALUE={val}
    {% elif axis == 'Y' %}
        SET_TMC_FIELD STEPPER=stepper_y FIELD=SGTHRS VALUE={val}
    {% else %}
        { action_raise_error("AXIS must be X or Y") }
    {% endif %}
    M117 {axis} SGTHRS={val}
    G28 {axis}
