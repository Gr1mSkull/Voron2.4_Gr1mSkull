#####################################################################
# XY — sensorless homing (StallGuard / TMC2209) на FLY-D8
# ⚠ Установите джамперы DIAG на драйверах DRIVER0 (X) и DRIVER1 (Y)
#   и заведите их на разъёмы X-MIN (PD9) и Y-MIN (PD8) соответственно.
#   (на FLY-D8: X-MIN=PD9, Y-MIN=PD8, Z-MIN=PD11)
# После сборки откалибруйте driver_SGTHRS для X и Y (SGTHRS_TEST).
#####################################################################

[stepper_x]
step_pin: PE5
dir_pin: PA8
enable_pin: !PA15
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 500
position_max: 500
homing_speed: 50
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC9
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PD9
driver_SGTHRS: 80

[stepper_y]
step_pin: PE4
dir_pin: PC11
enable_pin: !PC12
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
position_endstop: 500
position_max: 500
homing_speed: 50
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PC10
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PD8
driver_SGTHRS: 80
