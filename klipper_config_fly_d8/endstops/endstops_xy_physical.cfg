#####################################################################
# XY — физические концевики (FLY-D8)
# X: EBB SB2209 (toolhead) — порт X / gpio6
# Y: FLY-D8 — разъём Y-MIN / PD11
# X = DRIVER0, Y = DRIVER1 на FLY-D8
#####################################################################

[stepper_x]
step_pin: PE5
dir_pin: PA8
enable_pin: !PA15
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^EBBCan:gpio6
position_min: 0
position_endstop: 500
position_max: 500
homing_speed: 50
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC9
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

[stepper_y]
step_pin: PE4
dir_pin: PC11
enable_pin: !PC12
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PD11
position_min: 0
position_endstop: 500
position_max: 500
homing_speed: 50
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PC10
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

# ⚠ Направление моторов проверьте после сборки (G28 X / G28 Y).
#   Если ось едет от концевика — добавьте/уберите "!" у dir_pin.
