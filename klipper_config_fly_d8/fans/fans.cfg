#####################################################################
# Вентиляторы корпуса, exhaust, Nevermore, подсветка (FLY-D8)
# Вентиляторы хотенда и обдув детали — на EBB SB2209 (см. stealthburner.cfg).
# Здесь только рамные выходы. FLY-D8 имеет 6 FAN-портов (FAN0..FAN5).
#####################################################################

[heater_fan controller_fan]
pin: PA2                       # FAN2
kick_start_time: 0.5
heater: heater_bed
heater_temp: 45.0

[fan_generic exhaust_fan]
pin: PC6                       # FAN3
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0

[fan_generic nevermore]
pin: PC7                       # FAN4
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 2.0

[output_pin caselight]
pin: PC8                       # FAN5
pwm: true
shutdown_value: 0
value: 0
cycle_time: 0.01

# PS_ON: у FLY-D8 нет выделенного PS-ON порта в референсе.
# Если управляете питанием через Klipper — заведите свободный FAN/HE
# порт и раскомментируйте, указав его пин:
# [output_pin ps_on]
# pin: PA1                     # FAN1 (пример свободного порта — проверьте)
# value: 1
