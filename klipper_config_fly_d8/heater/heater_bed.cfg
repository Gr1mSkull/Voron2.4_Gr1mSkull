#####################################################################
# Нагрев стола — AC SSR ~300W (FLY-D8)
# H-BED (PB0) | Термистор Bed-Temp (PC5) — проверьте тип на кабеле кровати
#####################################################################

[heater_bed]
heater_pin: PB0
sensor_type: Generic 3950
sensor_pin: PC5
max_power: 1.0
min_temp: 0
max_temp: 120
control: pid
pid_Kp: 58.437
pid_Ki: 2.347
pid_Kd: 363.769

# 300W @ 230V ≈ 1.3A — для SSR 25A max_power: 1.0 безопасен
# После сборки: PID_CALIBRATE HEATER=heater_bed TARGET=60
