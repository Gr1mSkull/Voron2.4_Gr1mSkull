#####################################################################
# MCU — FLY-D8 (STM32F407) как USB-to-CAN bridge @ 1000000 + Raspberry Pi 4B
# Хост (RPi 4B) не имеет CAN — мост поднимает плата FLY-D8.
# UUID получить: sudo systemctl stop klipper && python3 ~/katapult/scripts/flash_can.py -q
#####################################################################

[mcu]
canbus_uuid: REPLACE_WITH_FLYD8_UUID
canbus_interface: can0

[mcu EBBCan]
canbus_uuid: REPLACE_WITH_EBB_UUID
canbus_interface: can0

[temperature_sensor FLY-D8]
sensor_type: temperature_mcu

[temperature_sensor RaspberryPi]
sensor_type: temperature_host

# EXP1/EXP2 (если когда-нибудь понадобится mini12864; дисплей — KlipperScreen)
[board_pins]
aliases:
    EXP1_1=PB10, EXP1_2=PB1,
    EXP1_3=PA14, EXP1_4=PA13,
    EXP1_5=PE15, EXP1_6=PE14,
    EXP1_7=PE13, EXP1_8=PB11,
    EXP1_9=<GND>, EXP1_10=<5V>,
    EXP2_1=PB14, EXP2_2=PB13,
    EXP2_3=PA9, EXP2_4=PB12,
    EXP2_5=PA10, EXP2_6=PB15,
    EXP2_7=PE12, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>
