#####################################################################

# --- XY ENDSTOPS: РОВНО ОДИН вариант ---
# ВАЖНО: при смене также выставьте sensorless_x/y в
#        toolchanger/toolchanger-config.cfg → [gcode_macro homing_override_config]
[include endstops/endstops_xy_physical.cfg]
# [include endstops/endstops_xy_sensorless.cfg]

#####################################################################
# ▲▲▲ КОНЕЦ ПЕРЕКЛЮЧАТЕЛЕЙ ▲▲▲
#####################################################################

[include steppers/steppers_z.cfg]
[include heater/heater_bed.cfg]
[include fans/fans.cfg]
[include homing/quad_gantry_level.cfg]
[include bed_mesh/bed_mesh.cfg]
[include macros/macros.cfg]

#####################################################################
# Тулченджер klipper-toolchanger-easy
# Эта строка подключает readonly-фреймворк, который сам включает:
#   homing.cfg, tool_detection.cfg, toolchanger.cfg, toolchanger-macros.cfg,
#   calibrate-offsets.cfg, crash-detection.cfg,
#   ../tools/T*.cfg  и  ../toolchanger-config.cfg (последним — для оверрайдов)
#####################################################################
[include toolchanger/readonly-configs/toolchanger-include.cfg]
