#####################################################################
# Макросы — Voron 2.4 StealthChanger
# T0..T5 и SELECT_TOOL/UNSELECT_TOOL предоставляет klipper-toolchanger-easy.
#####################################################################

[gcode_macro LIGHTS_ON]
gcode:
    SET_PIN PIN=caselight VALUE=1

[gcode_macro LIGHTS_OFF]
gcode:
    SET_PIN PIN=caselight VALUE=0

[gcode_macro NEVERMORE_ON]
gcode:
    SET_FAN_SPEED FAN=nevermore SPEED=1.0

[gcode_macro NEVERMORE_OFF]
gcode:
    SET_FAN_SPEED FAN=nevermore SPEED=0

[gcode_macro EXHAUST_ON]
gcode:
    SET_FAN_SPEED FAN=exhaust_fan SPEED=1.0

[gcode_macro EXHAUST_OFF]
gcode:
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0

#####################################################################
# PRINT_START — для мультиматериальной печати тулченджером
# Слайсер вызывает: PRINT_START TOOL=0 TOOL_TEMP=250 BED_TEMP=60
# (см. DraftShift StealthChanger Wiki → Slicers)
#####################################################################
[gcode_macro PRINT_START]
gcode:
    {% set TOOL = params.TOOL | default(-1) | int %}
    {% set TOOL_TEMP = params.TOOL_TEMP | default(0) | int %}
    {% set BED_TEMP = params.BED_TEMP | default(0) | int %}

    STOP_CRASH_DETECTION
    LIGHTS_ON

    M117 Heating Bed
    M140 S{BED_TEMP}
    M190 S{BED_TEMP}

    M117 Homing
    G28
    T0                          ; гомимся/QGL/mesh всегда с T0

    M117 Quad Gantry Level
    QUAD_GANTRY_LEVEL
    G28 Z

    M117 Bed Mesh
    BED_MESH_CALIBRATE

    # Выбор рабочей головы
    {% if TOOL >= 0 %}
        M104 T0 S0              ; погасить T0, если печатаем не ей
        T{TOOL}
        {% set initialToolTemp = 'T' ~ TOOL|string ~ '_TEMP' %}
        M117 Waiting on T{TOOL}
        M109 S{params[initialToolTemp] | default(TOOL_TEMP) | int}
    {% else %}
        M109 S{TOOL_TEMP}
    {% endif %}

    START_CRASH_DETECTION
    M117 Printing...

[gcode_macro PRINT_END]
gcode:
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    STOP_CRASH_DETECTION
    M400
    G92 E0
    G1 E-6.0 F3600
    TURN_OFF_HEATERS
    M107
    G91
    G0 Z5 F3000
    G90
    PARK_TOOL                   ; вернуть активную голову в док (из toolchanger-easy)
    BED_MESH_CLEAR
    NEVERMORE_ON
    EXHAUST_ON
    UPDATE_DELAYED_GCODE ID=_sc_vent_off DURATION=600
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

[delayed_gcode _sc_vent_off]
gcode:
    EXHAUST_OFF
    NEVERMORE_OFF

[gcode_macro SGTHRS_TEST]
description: Подбор sensorless — SGTHRS_TEST AXIS=X VALUE=80
gcode:
    {% set axis = params.AXIS|default('X')|upper %}
    {% set val = params.VALUE|default(80)|int %}
    {% if axis == 'X' %}
        SET_TMC_FIELD STEPPER=stepper_x FIELD=SGTHRS VALUE={val}
    {% elif axis == 'Y' %}
        SET_TMC_FIELD STEPPER=stepper_y FIELD=SGTHRS VALUE={val}
    {% endif %}
    M117 {axis} SGTHRS={val}
