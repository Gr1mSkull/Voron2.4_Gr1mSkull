#####################################################################
# toolchanger-config.cfg — ПОЛЬЗОВАТЕЛЬСКИЕ оверрайды (включается ПОСЛЕДНИМ)
# Здесь переопределяем значения readonly-фреймворка.
#####################################################################

[rounded_path]
resolution: 0.2
replace_g0: False

[force_move]
enable_force_move: True

#####################################################################
# Параметры тулченджера (пути дока проверены для StealthChanger ModularDock)
#####################################################################
[toolchanger]
params_dropoff_path: [{'y':9.5 ,'z':4}, {'y':9.5, 'z':2}, {'y':5.5, 'z':0}, {'z':0, 'y':0, 'f':0.5}, {'z':-10, 'y':0}, {'z':-10, 'y':16}]
params_pickup_path: [{'z':-10, 'y':16}, {'z':-10, 'y':0}, {'z':0, 'y':0, 'f':0.5, 'verify':1}, {'y':5.5, 'z':0}, {'y':9.5, 'z':2}, {'y':9.5 ,'z':4}]
params_safe_y: 120            # Расстояние от 0 до задней стенки доков (+ запас)
params_close_y: 30            # Относит. сближение к доку при смене
params_fast_speed: 10000      # Скорость вне дока
params_path_speed: 900        # Скорость pickup/dropoff
require_tool_present: True     # OptoTap для Z → при старте голова должна быть на шаттле

#####################################################################
# HOMING — выбор sensorless / физические концевики
# Должно СООТВЕТСТВОВАТЬ выбранному файлу endstops/ в printer.cfg!
#####################################################################
[gcode_macro homing_override_config]
variable_sensorless_x: False     # endstops_xy_physical → False; sensorless → True
variable_sensorless_y: False
variable_homing_rebound_y: 0     # для sensorless обычно 20
variable_stepper_driver: "tmc2209"
variable_homing_current: 0.49
gcode:

#####################################################################
# КАЛИБРОВКА XY-СМЕЩЕНИЙ ГОЛОВ — пробник Nudge
#####################################################################

# Положение переключателя Nudge на столе/раме (измерьте!)
[gcode_macro _CALIBRATION_SWITCH]
variable_x: 250.0
variable_y: 250.0
variable_z: 5.00
gcode:

[tools_calibrate]
pin: ^PF0                # ⚠ свободный вход на M8P для Nudge — проверьте пин
travel_speed: 20
spread: 7
lower_z: 1.0
speed: 2
lift_speed: 4
final_lift_z: 6
sample_retract_dist: 2
samples_tolerance: 0.05
samples: 5
samples_result: median
# Калибровка Z-смещения сопла (опционально) — раскомментируйте при наличии
# nozzle-пробника и укажите его имя; с per-tool OptoTap обычно НЕ требуется:
#probe: T0
#trigger_to_bottom_z: 0.25

# Деадбенд температуры для M109 (опц.)
#[gcode_macro SET_TEMPERATURE_WITH_DEADBAND]
#variable_default_deadband: 4.0
