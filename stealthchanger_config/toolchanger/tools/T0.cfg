#####################################################################
# T0 — голова 0 (ОПОРНАЯ) | EBB SB2209 CAN (RP2040) | Rapido PT1000
# Прошивка RP2040: CAN (gpio4/gpio5) @ 1000000
# UUID:  python3 ~/katapult/scripts/flash_can.py -q
#####################################################################

[mcu EBBT0]
canbus_uuid: REPLACE_WITH_T0_UUID
canbus_interface: can0

# --- Акселерометр (для Input Shaper) ---
# ⚠ Одновременно в конфиге может быть только ОДИН [adxl345].
#    Раскомментируйте только на время калибровки активной головы.
#[adxl345]
#cs_pin: EBBT0:gpio1
#spi_software_sclk_pin: EBBT0:gpio2
#spi_software_mosi_pin: EBBT0:gpio0
#spi_software_miso_pin: EBBT0:gpio3
#axes_map: z,-y,x

[extruder]
step_pin: EBBT0:gpio18
dir_pin: !EBBT0:gpio19
enable_pin: !EBBT0:gpio17
microsteps: 16
rotation_distance: 22.6789511
gear_ratio: 50:10
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: EBBT0:gpio7
# Rapido = PT1000 (2-провода) на входе термистора.
# Если на плате стоит 2.2k пуллап для PT1000 — раскомментируйте pullup_resistor.
sensor_type: PT1000
sensor_pin: EBBT0:gpio27
#pullup_resistor: 2200
min_temp: 0
max_temp: 300
max_power: 1.0
min_extrude_temp: 170
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
pressure_advance: 0.04

[tmc2209 extruder]
uart_pin: EBBT0:gpio20
run_current: 0.650
stealthchop_threshold: 999999

[heater_fan T0_hotend_fan]
pin: EBBT0:gpio14
heater: extruder
heater_temp: 50.0

[fan_generic T0_partfan]
pin: EBBT0:gpio13

[gcode_macro T0]
variable_active: 0
variable_color: ""
gcode:
    SELECT_TOOL T=0

[tool T0]
tool_number: 0
extruder: extruder
fan: T0_partfan
# T0 — опорная: gcode-смещения = 0
# Координаты головы в доке (ИЗМЕРЬТЕ для вашей рамы):
params_park_x: 23
params_park_y: 3
params_park_z: 310
# Input Shaper (заполнить после калибровки):
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 50
params_input_shaper_damping_ratio_x: 0.1
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 40
params_input_shaper_damping_ratio_y: 0.1

[tool_probe T0]
pin: ^EBBT0:gpio22
tool: 0
x_offset: 0
y_offset: 0
# z_offset — откалибровать (будет отрицательным)
z_offset: -1.20
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder TEMP=150
