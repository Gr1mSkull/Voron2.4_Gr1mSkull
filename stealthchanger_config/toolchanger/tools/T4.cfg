#####################################################################
# T4 — голова 4 | EBB SB2209 CAN (RP2040) | Rapido PT1000
#####################################################################

[mcu EBBT4]
canbus_uuid: REPLACE_WITH_T4_UUID
canbus_interface: can0

#[adxl345]
#cs_pin: EBBT4:gpio1
#spi_software_sclk_pin: EBBT4:gpio2
#spi_software_mosi_pin: EBBT4:gpio0
#spi_software_miso_pin: EBBT4:gpio3
#axes_map: z,-y,x

[extruder4]
step_pin: EBBT4:gpio18
dir_pin: !EBBT4:gpio19
enable_pin: !EBBT4:gpio17
microsteps: 16
rotation_distance: 22.6789511
gear_ratio: 50:10
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: EBBT4:gpio7
sensor_type: PT1000
sensor_pin: EBBT4:gpio27
#pullup_resistor: 2200
min_temp: 0
max_temp: 300
max_power: 1.0
min_extrude_temp: 170
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
pressure_advance: 0.04

[tmc2209 extruder4]
uart_pin: EBBT4:gpio20
run_current: 0.650
stealthchop_threshold: 999999

[heater_fan T4_hotend_fan]
pin: EBBT4:gpio14
heater: extruder4
heater_temp: 50.0

[fan_generic T4_partfan]
pin: EBBT4:gpio13

[gcode_macro T4]
variable_active: 0
variable_color: ""
gcode:
    SELECT_TOOL T=4

[tool T4]
tool_number: 4
extruder: extruder4
fan: T4_partfan
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
params_park_x: 263
params_park_y: 3
params_park_z: 310
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 50
params_input_shaper_damping_ratio_x: 0.1
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 40
params_input_shaper_damping_ratio_y: 0.1

[tool_probe T4]
pin: ^EBBT4:gpio22
tool: 4
x_offset: 0
y_offset: 0
z_offset: 0
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder4 TEMP=150
